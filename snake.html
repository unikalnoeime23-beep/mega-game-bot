<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: #fff; font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .nav { display: flex; width: 100%; background: #161b22; border-bottom: 1px solid #30363d; }
        .nav button { flex: 1; padding: 15px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        .nav button.active { color: #00ff00; border-bottom: 2px solid #00ff00; }
        
        .page { display: none; width: 100%; flex-direction: column; align-items: center; padding-top: 20px; }
        .page.active { display: flex; }

        #score { font-size: 30px; color: #00ff00; font-weight: bold; }
        canvas { border: 3px solid #30363d; background: #000; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        
        /* Магазин Змейки */
        .shop-item { width: 90%; background: #161b22; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; }
        .buy-btn { background: #238636; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; }
        .buy-btn:disabled { background: #21262d; color: #484f58; }

        .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-top: 20px; }
        .controls button { background: #161b22; color: #00ff00; border: 2px solid #30363d; border-radius: 15px; font-size: 25px; height: 60px; }
    </style>
</head>
<body>
    <div class="nav">
        <button id="tab-game" class="active" onclick="tab('game')">ЗМЕЙКА</button>
        <button id="tab-shop" onclick="tab('shop')">МАГАЗИН</button>
        <button onclick="location.href='index.html'" style="color: #f85149;">ВЫХОД</button>
    </div>

    <div id="page-game" class="page active">
        <div id="score">0</div>
        <canvas id="snakeGame" width="300" height="300"></canvas>
        <div class="controls">
            <button style="grid-column: 2;" onclick="changeDir('up')">↑</button>
            <button style="grid-column: 1;" onclick="changeDir('left')">←</button>
            <button style="grid-column: 2;" onclick="changeDir('down')">↓</button>
            <button style="grid-column: 3;" onclick="changeDir('right')">→</button>
        </div>
    </div>

    <div id="page-shop" class="page">
        <h2>Магазин Змейки</h2>
        <div class="shop-item">
            <div>
                <strong>Замедление</strong><br>
                <small>Змейка ползет медленнее. Цена: 50</small>
            </div>
            <button class="buy-btn" id="buy-slow" onclick="buySnake('slow', 50)">Купить</button>
        </div>
        <div class="shop-item">
            <div>
                <strong>Множитель очков</strong><br>
                <small>x2 за яблоко. Цена: 100</small>
            </div>
            <button class="buy-btn" id="buy-x2" onclick="buySnake('x2', 100)">Купить</button>
        </div>
    </div>

    <script>
        let score = 0;
        let speed = 120;
        let multiplier = 1;
        let coins = parseInt(localStorage.getItem('danila_coins')) || 0;

        function tab(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        function buySnake(type, cost) {
            if (coins >= cost) {
                coins -= cost;
                if (type === 'slow') speed += 10;
                if (type === 'x2') multiplier += 1;
                localStorage.setItem('danila_coins', coins);
                updateShop();
                alert('Улучшено!');
            }
        }

        function updateShop() {
            document.getElementById('buy-slow').disabled = coins < 50;
            document.getElementById('buy-x2').disabled = coins < 100;
        }

        // Логика игры (вставь сюда свой код отрисовки змейки, используя переменные speed и multiplier)
        // При смерти: localStorage.setItem('danila_coins', coins + score);
        updateShop();
    </script>
</body>
</html>
