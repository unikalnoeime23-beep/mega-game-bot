<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0d1117; color: #fff; font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #score { font-size: 30px; margin-bottom: 10px; color: #00ff00; font-weight: bold; }
        canvas { border: 3px solid #30363d; background: #000; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); max-width: 90vw; max-height: 50vh; }
        .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(2, 70px); gap: 15px; margin-top: 20px; }
        button { background: #161b22; color: #00ff00; border: 2px solid #30363d; border-radius: 15px; font-size: 30px; touch-action: manipulation; box-shadow: 0 4px #000; cursor: pointer; }
        button:active { transform: translateY(3px); box-shadow: 0 1px #000; background: #30363d; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <div id="score">0</div>
    <canvas id="snakeGame" width="320" height="320"></canvas>

    <div class="controls">
        <button class="up" onclick="changeDir('up')">↑</button>
        <button class="left" onclick="changeDir('left')">←</button>
        <button class="down" onclick="changeDir('down')">↓</button>
        <button class="right" onclick="changeDir('right')">→</button>
    </div>

    <script>
        // --- 8-БИТНЫЙ ЗВУК ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Разблокировка аудио для телефонов при клике на любую часть экрана или кнопку
        document.body.addEventListener('touchstart', () => {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                audioCtx.resume();
            }
        }, { once: true });

        // --- ЛОГИКА ИГРЫ ---
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const box = 16;
        let score = 0;
        let snake = [{ x: 9 * box, y: 10 * box }];
        let food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
        let d = "right";

        function changeDir(dir) {
            if (!audioCtx) { audioCtx = new AudioContext(); audioCtx.resume(); } // На всякий случай дублируем разблокировку на кнопках

            if (dir == "up" && d != "down") d = "up";
            if (dir == "left" && d != "right") d = "left";
            if (dir == "down" && d != "up") d = "down";
            if (dir == "right" && d != "left") d = "right";
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00ff00" : "#008000";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "left") snakeX -= box;
            if (d == "up") snakeY -= box;
            if (d == "right") snakeX += box;
            if (d == "down") snakeY += box;

            // Съели еду
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerText = score;
                playSound('eat'); // ЗВУК ПОЕДАНИЯ
                food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Столкновение
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                playSound('die'); // ЗВУК СМЕРТИ

                if (window.Telegram && window.Telegram.WebApp && score > 0) {
                    // Даем звуку проиграться 400мс, потом закрываем и отправляем очки
                    setTimeout(() => {
                        window.Telegram.WebApp.sendData(score.toString());
                    }, 400);
                } else {
                    setTimeout(() => { location.reload(); }, 1000);
                }
                return;
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 120);
    </script>
</body>
</html>
