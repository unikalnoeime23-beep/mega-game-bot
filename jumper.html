<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Jumper Classic Square</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Arial', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; background: #87CEEB; box-shadow: 0 0 20px rgba(0,0,0,0.2); margin: 0 auto; max-width: 100%; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 900; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0; let platforms = []; let gameActive = true; let scale = 1;

        const player = { baseSize: 20, width: 20, height: 20, x: 0, y: 0, vy: 0, gravity: 0.5, jumpForce: -13, speed: 8 };

        // --- НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ УПРАВЛЕНИЯ ---
        let isTouchingLeft = false;
        let isTouchingRight = false;

        function resizeCanvas() {
            canvas.width = 400; canvas.height = window.innerHeight;
            player.width = player.baseSize; player.height = player.baseSize;
            resetGame();
        }

        function resetGame() {
            score = 0; scoreElement.innerText = score; gameActive = true;
            player.x = canvas.width / 2 - player.width / 2; player.y = canvas.height - 150; player.vy = 0;
            isTouchingLeft = false; isTouchingRight = false;
            createPlatforms();
        }

        function createPlatforms() {
            platforms = []; const platformCount = 7; const platformWidth = 65; const platformHeight = 12;
            platforms.push({ x: canvas.width / 2 - platformWidth / 2, y: canvas.height - 50, w: platformWidth, h: platformHeight });
            for (let i = 1; i < platformCount; i++) {
                platforms.push({ x: Math.random() * (canvas.width - platformWidth), y: canvas.height - i * (canvas.height / platformCount) - 50, w: platformWidth, h: platformHeight });
            }
        }

        function drawPlayer() {
            ctx.fillStyle = '#FF4500'; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(player.x, player.y, player.width, player.height);
        }

        function drawPlatforms() {
            ctx.fillStyle = '#228B22'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            platforms.forEach(p => { ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h); });
        }

        function update() {
            if (!gameActive) return;

            // --- ПЛАВНОЕ УПРАВЛЕНИЕ ЗДЕСЬ ---
            if (isTouchingLeft) player.x -= player.speed;
            if (isTouchingRight) player.x += player.speed;

            player.vy += player.gravity; player.y += player.vy;

            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.width > p.x && player.x < p.x + p.w && player.y + player.height > p.y && player.y + player.height < p.y + p.h + player.vy) {
                        player.vy = player.jumpForce; score++; scoreElement.innerText = score;
                    }
                });
            }

            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y; player.y = canvas.height / 2;
                platforms.forEach(p => { p.y += diff; if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * (canvas.width - p.w); } });
            }

            if (player.y > canvas.height) { gameActive = false; setTimeout(resetGame, 1000); }
            if (player.x + player.width < 0) { player.x = canvas.width; } else if (player.x > canvas.width) { player.x = -player.width; }
        }

        function gameLoop() {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawPlatforms(); drawPlayer(); update(); requestAnimationFrame(gameLoop);
        }

        // --- ОБНОВЛЕННЫЕ СЛУШАТЕЛИ КАСАНИЙ ---
        window.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) isTouchingLeft = true;
            else isTouchingRight = true;
        });

        window.addEventListener('touchend', () => {
            isTouchingLeft = false;
            isTouchingRight = false;
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); gameLoop();
    </script>
</body>
</html>
