<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Данила Хаб: Фикс Игр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; }
        body { font-family: 'Press Start 2P', cursive; background: #1a1a1a; color: var(--dark); margin: 0; padding: 0; height: 100vh; overflow: hidden; touch-action: none; }
        .console { flex: 1; background: var(--bg); margin: 5px; border: 6px solid #333; border-radius: 10px; display: flex; flex-direction: column; height: calc(100vh - 10px); position: relative; }
        .header { padding: 5px 10px; border-bottom: 2px solid var(--dark); background: rgba(0,0,0,0.05); flex-shrink: 0; font-size: 7px; }
        .nav { display: flex; background: #222; flex-shrink: 0; }
        .nav button { flex: 1; padding: 12px; border: none; background: #333; color: #666; font-family: 'Press Start 2P'; font-size: 7px; }
        .nav button.active { background: var(--bg); color: var(--dark); }
        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; overflow-y: auto; }
        .view.active { display: flex; }
        canvas { background: var(--bg); border: 3px solid var(--dark); image-rendering: pixelated; display: block; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 10px; }
        .btn { background: var(--dark); color: var(--bg); border: none; width: 60px; height: 50px; font-size: 14px; border-radius: 5px; }
        .card { border: 2px solid var(--dark); padding: 8px; margin: 5px 0; width: 85%; text-align: center; font-size: 7px; background: rgba(0,0,0,0.03); }
        .buy-btn { background: var(--dark); color: var(--bg); border: none; padding: 8px; font-family: 'Press Start 2P'; font-size: 7px; width: 100%; margin-top: 5px; }
        #tap-btn { width: 120px; height: 120px; background: var(--dark); border: 6px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 10px; }
        .pop { position: absolute; font-size: 10px; pointer-events: none; animation: popUp 0.5s forwards; color: var(--dark); font-weight: bold; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
        .prestige-btn { background: #e74c3c; color: white; border: 2px solid #c0392b; padding: 10px; font-family: 'Press Start 2P'; font-size: 7px; margin-top: 10px; width: 85%; }
    </style>
</head>
<body>
<div class="console">
    <div class="header">
        <div style="display:flex; justify-content:space-between">
            <span>DC:<span id="dc-val">0</span></span>
            <span>X<span id="mult-val">1.0</span></span>
        </div>
        <div style="margin-top:5px"><span id="rank-ico">🆕</span> <span id="rank-name">НОВИЧОК</span></div>
    </div>
    <div class="nav">
        <button id="n-menu" class="active" onclick="showTab('menu')">ИГРЫ</button>
        <button id="n-shop" onclick="showTab('shop')">ШОП</button>
        <button onclick="tg.close()">ВЫКЛ</button>
    </div>
    <div id="v-menu" class="view active">
        <div class="card">ТАПЕР<button class="buy-btn" onclick="startGame('clicker')">ИГРАТЬ</button></div>
        <div class="card">ЗМЕЙКА<button class="buy-btn" onclick="startGame('snake')">ИГРАТЬ</button></div>
        <div class="card">ДЖАМПЕР<button class="buy-btn" onclick="startGame('jumper')">ИГРАТЬ</button></div>
        <div id="p-area"></div>
    </div>
    <div id="v-clicker" class="view"><div id="tap-btn" onpointerdown="doTap(event)">ТАП!</div></div>
    <div id="v-snake" class="view">
        <canvas id="snakeCanvas"></canvas>
        <div class="controls">
            <button class="btn" style="grid-column: 2" onpointerdown="sd='up'">U</button>
            <button class="btn" style="grid-row: 2; grid-column: 1" onpointerdown="sd='left'">L</button>
            <button class="btn" style="grid-row: 2; grid-column: 2" onpointerdown="sd='down'">D</button>
            <button class="btn" style="grid-row: 2; grid-column: 3" onpointerdown="sd='right'">R</button>
        </div>
    </div>
    <div id="v-jumper" class="view">
        <canvas id="jumperCanvas"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 180px;">
            <button class="btn" style="width: 85px;" onpointerdown="jd=-1" onpointerup="jd=0">ЛЕВО</button>
            <button class="btn" style="width: 85px;" onpointerdown="jd=1" onpointerup="jd=0">ПРАВО</button>
        </div>
    </div>
    <div id="v-shop" class="view" style="justify-content: flex-start; padding-top: 10px;"><div id="shop-list" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div></div>
</div>
<script>
    const tg = window.Telegram.WebApp; tg.expand();
    let coins = parseFloat(localStorage.getItem('d_dc')) || 0;
    let prestige = parseInt(localStorage.getItem('d_pr')) || 0;
    let lvls = JSON.parse(localStorage.getItem('d_lv')) || { c_pwr:0, c_auto:0, c_crit:0, s_mult:0, s_slow:0, j_jmp:0, j_grv:0 };
    let cur = 'clicker', engine, jd = 0, sd = 'right';
    const ranks = [{c:0,n:"НОВИЧОК",i:"🆕"},{c:1000,n:"БРОНЗА",i:"🥉"},{c:10000,n:"СЕРЕБРО",i:"🥈"},{c:100000,n:"ЗОЛОТО",i:"🥇"},{c:1000000,n:"МАСТЕР",i:"💎"},{c:1000000000,n:"БОГ",i:"⚛️"}];
    const upgs = {
        clicker: [{id:'c_pwr',n:"СИЛА",b:100},{id:'c_auto',n:"АВТО",b:500},{id:'c_crit',n:"КРИТ",b:2000}],
        snake: [{id:'s_mult',n:"ЕДА X2",b:200},{id:'s_slow',n:"МЕДЛЕННО",b:800}],
        jumper: [{id:'j_jmp',n:"ПРЫЖОК+",b:400},{id:'j_grv',n:"ГРАВ-",b:1000}]
    };
    const a = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d) { try { let o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=0.02; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d); } catch(e){} }
    function updateUI() {
        let m = Math.pow(1.2, prestige); document.getElementById('dc-val').innerText = Math.floor(coins).toLocaleString(); document.getElementById('mult-val').innerText = m.toFixed(1);
        let r = ranks[0]; for(let x of ranks) if(coins >= x.c) r = x; document.getElementById('rank-ico').innerText = r.i; document.getElementById('rank-name').innerText = r.n;
        let prog = Math.min(100, (coins/1000000000)*100); document.getElementById('p-area').innerHTML = coins>=1000000000 ? `<button class="prestige-btn" onclick="doPrestige()">ПРЕСТИЖ X${(m*1.2).toFixed(1)}</button>` : '';
        localStorage.setItem('d_dc', coins); localStorage.setItem('d_pr', prestige); localStorage.setItem('d_lv', JSON.stringify(lvls));
    }
    function showTab(t) { clearInterval(engine); document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active')); document.getElementById('v-' + t).classList.add('active'); document.getElementById('n-' + t).classList.add('active'); if(t === 'shop') renderShop(); updateUI(); }
    function startGame(g) { cur = g; showTab(g); if(g==='snake') initSn(); if(g==='jumper') initJp(); }
    function renderShop() {
        const l = document.getElementById('shop-list'); l.innerHTML = ''; let m = upgs[cur] ? cur : 'clicker';
        upgs[m].forEach((it, i) => {
            let lv = lvls[it.id], p = Math.floor(it.b * Math.pow(2, lv));
            let d = document.createElement('div'); d.className = 'card'; d.innerHTML = `${it.n} LV:${lv}<button class="buy-btn" id="b-${i}" onclick="buy('${it.id}',${p})">${p} DC</button>`;
            l.appendChild(d); if(coins < p) document.getElementById('b-'+i).disabled = true;
        });
    }
    function buy(id, p) { if(coins >= p) { beep(600, 0.1); coins -= p; lvls[id]++; renderShop(); updateUI(); } }
    function doPrestige() { if(confirm("СБРОС?")) { prestige++; coins=0; lvls={c_pwr:0,c_auto:0,c_crit:0,s_mult:0,s_slow:0,j_jmp:0,j_grv:0}; showTab('menu'); } }
    function doTap(e) { let cr = Math.random() < (lvls.c_crit*0.05) ? 10 : 1; let g = (1 + lvls.c_pwr) * cr * Math.pow(1.2, prestige); coins += g; updateUI(); beep(400, 0.05); let p = document.createElement('div'); p.className='pop'; p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px'; p.innerText='+'+Math.floor(g); document.body.appendChild(p); setTimeout(()=>p.remove(), 500); }
    
    // SNAKE ENGINE
    let sn, sf;
    function initSn() {
        const c = document.getElementById('snakeCanvas'); c.width = 180; c.height = 180; const ctx = c.getContext('2d');
        sn = [{x:8,y:8}]; sf = {x:4,y:4}; sd = 'right';
        engine = setInterval(() => {
            ctx.fillStyle='#8bac0f'; ctx.fillRect(0,0,180,180); ctx.fillStyle='#0f380f';
            sn.forEach(p=>ctx.fillRect(p.x*10,p.y*10,9,9)); ctx.strokeRect(sf.x*10,sf.y*10,9,9);
            let h={...sn[0]}; if(sd=='up')h.y--; if(sd=='down')h.y++; if(sd=='left')h.x--; if(sd=='right')h.x++;
            if(h.x==sf.x && h.y==sf.y) { beep(800, 0.1); coins += (10+lvls.s_mult*10)*Math.pow(1.2,prestige); updateUI(); sf={x:Math.floor(Math.random()*18),y:Math.floor(Math.random()*18)}; } else sn.pop();
            if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) { sn=[{x:8,y:8}]; sd='right'; beep(100,0.2); } else sn.unshift(h);
        }, 140 + (lvls.s_slow*10));
    }

    // JUMPER ENGINE
    let jp, jPlats;
    function initJp() {
        const c = document.getElementById('jumperCanvas'); c.width = 200; c.height = 250; const ctx = c.getContext('2d');
        jp={x:90,y:150,vy:0}; jPlats=[]; for(let i=0;i<6;i++) jPlats.push({x:Math.random()*150,y:i*45,w:45,vx:Math.random()>0.8?1:0});
        engine = setInterval(() => {
            ctx.fillStyle='#8bac0f'; ctx.fillRect(0,0,200,250); ctx.fillStyle='#0f380f';
            jp.vy += (0.35 - lvls.j_grv*0.03); jp.y += jp.vy; jp.x += jd * 4;
            jPlats.forEach(p => { p.x+=p.vx; if(p.x<0||p.x>155) p.vx*=-1; ctx.fillRect(p.x,p.y,p.w,7); if(jp.vy>0 && jp.x+15>p.x && jp.x<p.x+p.w && jp.y+15>p.y && jp.y+15<p.y+10) { jp.vy = (-9-lvls.j_jmp*0.5); coins+=2*Math.pow(1.2,prestige); updateUI(); beep(500, 0.03); } });
            if(jp.y<80) { let d=80-jp.y; jp.y=80; jPlats.forEach(p=>{ p.y+=d; if(p.y>250){p.y=0; p.x=Math.random()*150;} }); }
            ctx.fillRect(jp.x,jp.y,15,15); if(jp.y>260) { jp={x:90,y:150,vy:0}; beep(100,0.2); }
            if(jp.x<0) jp.x=200; if(jp.x>200) jp.x=0;
        }, 30);
    }
    setInterval(() => { if(lvls.c_auto>0) { coins+=(lvls.c_auto*0.5)*Math.pow(1.2,prestige); updateUI(); } }, 1000);
    updateUI();
</script>
</body>
</html>
