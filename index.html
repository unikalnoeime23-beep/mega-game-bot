<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Общие стили для красоты */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0f1216; 
            color: white; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #00d4ff; text-shadow: 0 0 10px #00d4ff; font-size: 28px; }

        /* Контейнер для списка игр */
        .menu-container { width: 100%; max-width: 400px; }

        /* Карточка игры */
        .game-card {
            background: #1c2128;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .game-card:hover { border-color: #00d4ff; transform: translateY(-2px); }

        .game-info b { font-size: 18px; display: block; margin-bottom: 4px; }
        .game-info span { font-size: 12px; color: #8b949e; }

        /* Кнопка играть */
        .btn-play {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Экран самой игры (скрыт по умолчанию) */
        #game-view { display: none; text-align: center; width: 100%; }
        
        canvas { 
            background: #000; 
            border: 2px solid #00d4ff; 
            border-radius: 8px; 
            margin-top: 20px;
            touch-action: none; /* Чтобы страница не дергалась при игре */
        }

        .score-text { font-size: 24px; margin: 10px 0; color: #ff0055; }
    </style>
</head>
<body>

    <div id="main-menu" class="menu-container">
        <h1>GAME HUB 👾</h1>
        
        <div class="game-card">
            <div class="game-info">
                <b>🐍 Змейка</b>
                <span>Классическая аркада</span>
            </div>
            <button class="btn-play" onclick="showGame('snake')">ИГРАТЬ</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <b>🚀 Джамп</b>
                <span>Убивалка времени</span>
            </div>
            <button class="btn-play" onclick="showGame('jump')">ИГРАТЬ</button>
        </div>
    </div>

    <div id="game-view">
        <h2 id="game-title">ИГРА</h2>
        <div class="score-text">Очки: <span id="score-val">0</span></div>
        <canvas id="gameCanvas" width="300" height="400"></canvas>
        <br>
        <button class="btn-play" style="background: #ff0055; color: white; margin-top: 20px;" onclick="exitAndSave()">СОХРАНИТЬ И ВЫЙТИ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let currentGame = "";

        // Показать экран игры
        function showGame(gameName) {
            currentGame = gameName;
            score = 0;
            document.getElementById('score-val').innerText = "0";
            document.getElementById('game-title').innerText = gameName === 'snake' ? "🐍 ЗМЕЙКА" : "🚀 ДЖАМП";
            
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'block';

            // Если это Джамп, давай просто сделаем кликалку по холсту для теста
            initSimpleGame();
        }

        function initSimpleGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Нажимай сюда!", 80, 200);

            canvas.onclick = () => {
                score += 10;
                document.getElementById('score-val').innerText = score;
                tg.HapticFeedback.impactOccurred('light'); // Вибрация
            };
        }

        // Сохранение и отправка данных в БОТА (в main.py)
        function exitAndSave() {
            let result = {
                game: currentGame,
                score: score
            };
            tg.sendData(JSON.stringify(result)); // Отправка JSON строки
        }
    </script>
</body>
</html>
