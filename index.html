<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME HUB</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            margin-top: 40px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin: 0;
            background: linear-gradient(90deg, #00d2ff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .balance {
            font-size: 24px;
            margin: 10px 0;
            font-weight: bold;
            color: #ffcc00;
        }

        .game-list {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-icon {
            font-size: 24px;
        }

        .game-titles {
            display: flex;
            flex-direction: column;
        }

        .game-name {
            font-weight: bold;
            font-size: 18px;
        }

        .game-subtitle {
            font-size: 12px;
            color: #8b949e;
        }

        .play-button {
            background: #00a2ff;
            color: black;
            border: none;
            border-radius: 15px;
            padding: 10px 25px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.3);
            cursor: pointer;
        }

        .market-button {
            background: #ffaa00;
            color: black;
            border: none;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            padding: 18px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GAME HUB</h1>
        <div class="balance">💰 95</div>
    </div>

    <div class="game-list">
        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🐍</span>
                <div class="game-titles">
                    <span class="game-name">SNAKE</span>
                    <span class="game-subtitle">Neon Arcade</span>
                </div>
            </div>
            <button class="play-button" onclick="window.location.href='https://unikalnoeime23-beep.github.io/mega-game-bot/snake.html'">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🧱</span>
                <div class="game-titles">
                    <span class="game-name">TETRIS</span>
                    <span class="game-subtitle">Classic Block</span>
                </div>
            </div>
            <button class="play-button" onclick="window.location.href='https://unikalnoeime23-beep.github.io/mega-game-bot/tetris.html'">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🚀</span>
                <div class="game-titles">
                    <span class="game-name">JUMP</span>
                    <span class="game-subtitle">Gravity Test</span>
                </div>
            </div>
            <button class="play-button" onclick="window.location.href='https://unikalnoeime23-beep.github.io/mega-game-bot/jumper.html'">PLAY</button>
        </div>
    </div>

    <button class="market-button">Market & Custom</button>

</body>
</html>
