<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub: PRESTIGE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; }
        body { font-family: 'Press Start 2P', cursive; background: #1a1a1a; color: var(--dark); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        .console { flex: 1; background: var(--bg); margin: 8px; border: 10px solid #333; border-radius: 15px; display: flex; flex-direction: column; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.4); }
        .header { padding: 8px; border-bottom: 3px solid var(--dark); background: rgba(0,0,0,0.05); }
        .stats-row { display: flex; justify-content: space-between; font-size: 7px; margin-bottom: 4px; }
        .rank-line { font-size: 8px; color: #304010; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        
        .goal-bar { width: 100%; height: 6px; border: 1px solid var(--dark); background: transparent; overflow: hidden; margin-top: 4px; }
        #goal-fill { height: 100%; background: var(--dark); width: 0%; transition: width 0.3s; }

        .nav { display: flex; background: #222; }
        .nav button { flex: 1; padding: 12px; border: none; background: #333; color: #666; font-family: 'Press Start 2P'; font-size: 7px; }
        .nav button.active { background: var(--bg); color: var(--dark); }
        
        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }
        .view.active { display: flex; }
        
        canvas { background: var(--bg); border: 3px solid var(--dark); image-rendering: pixelated; display: block; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 10px; }
        .btn { background: var(--dark); color: var(--bg); border: none; width: 60px; height: 50px; font-size: 16px; border-radius: 5px; }
        
        .card { border: 2px solid var(--dark); padding: 10px; margin: 5px; width: 85%; text-align: center; background: rgba(0,0,0,0.03); }
        .buy-btn { background: var(--dark); color: var(--bg); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 7px; width: 100%; margin-top: 5px; cursor: pointer; }
        .buy-btn:disabled { opacity: 0.3; }

        #tap-btn { width: 130px; height: 130px; background: var(--dark); border: 6px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; position: relative; border-radius: 50%; }
        
        #artifact { position: absolute; width: 30px; height: 30px; background: var(--dark); border: 2px solid var(--bg); display: none; z-index: 100; color: var(--bg); font-size: 8px; align-items: center; justify-content: center; }
        .pop { position: absolute; font-size: 8px; pointer-events: none; animation: popUp 0.6s forwards; color: var(--dark); font-weight: bold; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

        .prestige-btn { background: #e74c3c; color: white; border: 3px solid #c0392b; padding: 10px; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer; margin-top: 10px; animation: glow 1s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 5px #e74c3c; } to { box-shadow: 0 0 20px #e74c3c; } }
    </style>
</head>
<body>

<div class="console">
    <div class="header">
        <div class="stats-row">
            <span>DC:<span id="dc-val">0</span></span>
            <span>X<span id="mult-val">1.0</span></span>
        </div>
        <div class="rank-line">
            <span id="rank-ico">🆕</span><span id="rank-name">НОВИЧОК</span>
        </div>
        <div class="goal-bar"><div id="goal-fill"></div></div>
    </div>

    <div class="nav">
        <button id="n-menu" class="active" onclick="showTab('menu')">ИГРЫ</button>
        <button id="n-shop" onclick="showTab('shop')">ШОП</button>
        <button onclick="tg.close()">ВЫКЛ</button>
    </div>

    <div id="v-menu" class="view active">
        <div class="card"><span>ПИКСЕЛЬ ТАП</span><button class="buy-btn" onclick="startGame('clicker')">ИГРАТЬ</button></div>
        <div class="card"><span>ЗМЕЙКА</span><button class="buy-btn" onclick="startGame('snake')">ИГРАТЬ</button></div>
        <div class="card"><span>ПРЫЖОК</span><button class="buy-btn" onclick="startGame('jumper')">ИГРАТЬ</button></div>
        <div id="prestige-area" style="width:85%"></div>
    </div>

    <div id="v-clicker" class="view">
        <div id="tap-btn" onpointerdown="doTap(event)">ЖМИ!</div>
        <div id="artifact" onpointerdown="catchArtifact(event)">🎁</div>
    </div>

    <div id="v-snake" class="view">
        <canvas id="snakeCanvas" width="180" height="180"></canvas>
        <div class="controls">
            <button class="btn" style="grid-column: 2" onpointerdown="setDir('up')">↑</button>
            <button class="btn" style="grid-row: 2; grid-column: 1" onpointerdown="setDir('left')">←</button>
            <button class="btn" style="grid-row: 2; grid-column: 2" onpointerdown="setDir('down')">↓</button>
            <button class="btn" style="grid-row: 2; grid-column: 3" onpointerdown="setDir('right')">→</button>
        </div>
    </div>

    <div id="v-jumper" class="view">
        <canvas id="jumperCanvas" width="200" height="250"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 180px;">
            <button class="btn" style="width: 85px;" onpointerdown="jDir=-1" onpointerup="jDir=0">L</button>
            <button class="btn" style="width: 85px;" onpointerdown="jDir=1" onpointerup="jDir=0">R</button>
        </div>
    </div>

    <div id="v-shop" class="view" style="justify-content: flex-start; overflow-y: auto; padding-top: 10px;">
        <div id="shop-list" style="width: 100%;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // СОХРАНЕНИЕ
    let coins = parseFloat(localStorage.getItem('dc_v5')) || 0;
    let prestige = parseInt(localStorage.getItem('dc_prestige')) || 0;
    let lvls = JSON.parse(localStorage.getItem('dc_lvls')) || {
        c_pwr: 0, c_auto: 0, c_crit: 0,
        s_mult: 0, s_spd: 0,
        j_jmp: 0, j_grv: 0
    };

    const PRESTIGE_GOAL = 1000000000;
    const ranks = [
        {c: 0, n: "НОВИЧОК", i: "🆕"},
        {c: 100, n: "МЛАДШИЙ", i: "👦"},
        {c: 1000, n: "РАБОТЯГА", i: "🥉"},
        {c: 10000, n: "ПРОФИ", i: "🥈"},
        {c: 100000, n: "БОГАТЫРЬ", i: "🥇"},
        {c: 1000000, n: "МАГНАТ", i: "💎"},
        {c: 10000000, n: "БИЗНЕС", i: "🔥"},
        {c: 100000000, n: "ВЛАСТЕЛИН", i: "👑"},
        {c: 1000000000, n: "БОГ", i: "⚛️"}
    ];

    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d) {
        try { const o = aCtx.createOscillator(); const g = aCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=0.03; o.connect(g); g.connect(aCtx.destination); o.start(); o.stop(aCtx.currentTime+d); } catch(e){}
    }

    const upgrades = {
        clicker: [
            {id:'c_pwr', n:"СИЛА", b:100},
            {id:'c_auto', n:"АВТО", b:500},
            {id:'c_crit', n:"КРИТ", b:2500}
        ],
        snake: [
            {id:'s_mult', n:"ЯБЛОКИ", b:200},
            {id:'s_spd', n:"ТОРМОЗ", b:1000}
        ],
        jumper: [
            {id:'j_jmp', n:"БОТИНКИ", b:400},
            {id:'j_grv', n:"КОСТЮМ", b:1500}
        ]
    };

    function updateUI() {
        let mult = Math.pow(1.2, prestige);
        document.getElementById('dc-val').innerText = Math.floor(coins).toLocaleString();
        document.getElementById('mult-val').innerText = mult.toFixed(1);
        
        let rank = ranks[0];
        for(let r of ranks) { if(coins >= r.c) rank = r; }
        document.getElementById('rank-ico').innerText = rank.i;
        document.getElementById('rank-name').innerText = rank.n;

        let prog = Math.min(100, (coins / PRESTIGE_GOAL) * 100);
        document.getElementById('goal-fill').style.width = prog + '%';

        const pArea = document.getElementById('prestige-area');
        if(coins >= PRESTIGE_GOAL) {
            pArea.innerHTML = `<button class="prestige-btn" onclick="doPrestige()">ПРЕСТИЖ (X${(mult*1.2).toFixed(1)})</button>`;
        } else { pArea.innerHTML = ''; }

        localStorage.setItem('dc_v5', coins);
        localStorage.setItem('dc_prestige', prestige);
        localStorage.setItem('dc_lvls', JSON.stringify(lvls));
    }

    function doPrestige() {
        if(confirm("Сбросить всё ради множителя x1.2?")) {
            prestige++;
            coins = 0;
            lvls = { c_pwr: 0, c_auto: 0, c_crit: 0, s_mult: 0, s_spd: 0, j_jmp: 0, j_grv: 0 };
            beep(800, 0.5);
            updateUI();
            showTab('menu');
        }
    }

    function renderShop() {
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        let m = upgrades[curGame] ? curGame : 'clicker';
        upgrades[m].forEach((it, i) => {
            let lv = lvls[it.id];
            let price = Math.floor(it.b * Math.pow(1.9, lv));
            let d = document.createElement('div'); d.className = 'card';
            d.innerHTML = `<div style="font-size:7px">${it.n} [LV:${lv}]</div><button class="buy-btn" id="b-${i}" onclick="buy('${m}',${i})">${price} DC</button>`;
            list.appendChild(d);
            if(coins < price) document.getElementById('b-'+i).disabled = true;
        });
    }

    function buy(m, i) {
        let it = upgrades[m][i];
        let price = Math.floor(it.b * Math.pow(1.9, lvls[it.id]));
        if(coins >= price) {
            beep(600, 0.1);
            coins -= price;
            lvls[it.id]++;
            updateUI(); renderShop();
        }
    }

    function doTap(e) {
        beep(400, 0.05);
        let crit = (Math.random() < (lvls.c_crit * 0.03)) ? 10 : 1;
        let gain = (1 + lvls.c_pwr) * Math.pow(1.2, prestige) * crit;
        coins += gain;
        updateUI();
        pop(e.clientX, e.clientY, (crit > 1 ? "CRIT! " : "+") + Math.floor(gain));
        if(Math.random() < 0.01) spawnArtifact();
    }

    function spawnArtifact() {
        const art = document.getElementById('artifact');
        art.style.display = 'flex';
        art.style.left = Math.random() * 70 + 15 + '%';
        art.style.top = Math.random() * 70 + 15 + '%';
        setTimeout(() => art.style.display = 'none', 3000);
    }

    function catchArtifact(e) {
        e.stopPropagation();
        beep(900, 0.2);
        let b = (100 + lvls.c_pwr * 10) * Math.pow(1.2, prestige);
        coins += b;
        document.getElementById('artifact').style.display = 'none';
        updateUI();
        pop(e.clientX, e.clientY, "BONUS! " + Math.floor(b));
    }

    function showTab(t) {
        clearInterval(gameLoop);
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + t).classList.add('active');
        document.getElementById('n-' + t)?.classList.add('active');
        if(t === 'shop') renderShop();
        updateUI();
    }

    let curGame = 'clicker';
    function startGame(g) { curGame=g; showTab(g); setTimeout(() => { if(g==='snake') initSnake(); if(g==='jumper') initJumper(); }, 100); }

    function pop(x,y,v) {
        let p = document.createElement('div'); p.className='pop'; p.style.left=x+'px'; p.style.top=y+'px'; p.innerText=v;
        document.body.appendChild(p); setTimeout(()=>p.remove(), 600);
    }

    // ЗМЕЙКА
    const sC = document.getElementById('snakeCanvas'), sX = sC.getContext('2d');
    let sn, sf, sd;
    function initSnake() { sn = [{x:8, y:8}]; sf = {x:4, y:4}; sd = 'right'; clearInterval(gameLoop); gameLoop = setInterval(drawSnake, Math.max(50, 130 - lvls.s_spd * 5)); }
    function setDir(d) { if(d=='up'&&sd!='down') sd='up'; if(d=='down'&&sd!='up') sd='down'; if(d=='left'&&sd!='right') sd='left'; if(d=='right'&&sd!='left') sd='right'; }
    function drawSnake() {
        sX.fillStyle = '#8bac0f'; sX.fillRect(0,0,180,180); sX.fillStyle = '#0f380f';
        sn.forEach(p => sX.fillRect(p.x*10, p.y*10, 9, 9)); sX.strokeRect(sf.x*10, sf.y*10, 9, 9);
        let h = {...sn[0]}; if(sd=='up') h.y--; if(sd=='down') h.y++; if(sd=='left') h.x--; if(sd=='right') h.x++;
        if(h.x==sf.x && h.y==sf.y) {
            beep(800, 0.1); 
            coins += (15 + lvls.s_mult * 10) * Math.pow(1.2, prestige); 
            updateUI(); 
            sf = {x:Math.floor(Math.random()*18), y:Math.floor(Math.random()*18)};
        } else sn.pop();
        if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) { beep(100, 0.2); initSnake(); } else sn.unshift(h);
    }

    // ДЖАМПЕР
    const jC = document.getElementById('jumperCanvas'), jX = jC.getContext('2d');
    let jp, jPlats, jDir=0;
    function initJumper() { jp = {x:90, y:150, vy:0}; jPlats = []; for(let i=0; i<6; i++) jPlats.push({x:Math.random()*150, y:i*45, w:45, vx: Math.random()>0.8?1:0}); clearInterval(gameLoop); gameLoop = setInterval(drawJumper, 30); }
    function drawJumper() {
        jX.fillStyle = '#8bac0f'; jX.fillRect(0,0,200,250);
        let grav = 0.35 - (lvls.j_grv * 0.03);
        let jump = -9 - (lvls.j_jmp * 0.5);
        jp.vy += grav; jp.y += jp.vy; jp.x += jDir * 4;
        jX.fillStyle = '#0f380f';
        jPlats.forEach(p => {
            p.x += p.vx; if(p.x<0||p.x>155) p.vx*=-1;
            jX.fillRect(p.x, p.y, p.w, 7);
            if(jp.vy > 0 && jp.x+15 > p.x && jp.x < p.x+p.w && jp.y+15 > p.y && jp.y+15 < p.y+10) { 
                jp.vy = jump; 
                coins += (5 + lvls.j_jmp) * Math.pow(1.2, prestige); 
                updateUI(); beep(500, 0.05); 
            }
        });
        if(jp.y < 80) { let d = 80 - jp.y; jp.y = 80; jPlats.forEach(p => { p.y += d; if(p.y > 250) { p.y = 0; p.x = Math.random()*150; }}); }
        jX.fillRect(jp.x, jp.y, 15, 15);
        if(jp.y > 260) { beep(100, 0.2); initJumper(); }
        if(jp.x < 0) jp.x = 200; if(jp.x > 200) jp.x = 0;
    }

    setInterval(() => {
        if(lvls.c_auto > 0) {
            coins += (lvls.c_auto * 2) * Math.pow(1.2, prestige);
            updateUI();
        }
    }, 1000);

    updateUI();
</script>
</body>
</html>
