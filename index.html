<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub: Prestige Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; }
        body { font-family: 'Press Start 2P', cursive; background: #1a1a1a; color: var(--dark); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        .console { flex: 1; background: var(--bg); margin: 8px; border: 8px solid #333; border-radius: 15px; display: flex; flex-direction: column; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.4); }
        .header { padding: 8px; border-bottom: 3px solid var(--dark); background: rgba(0,0,0,0.05); }
        .stats-row { display: flex; justify-content: space-between; font-size: 7px; margin-bottom: 5px; }
        .rank-info { font-size: 8px; color: #304010; margin-top: 5px; }
        .goal-bar { width: 100%; height: 6px; border: 1px solid var(--dark); background: transparent; overflow: hidden; margin-top: 5px; }
        #goal-fill { height: 100%; background: var(--dark); width: 0%; transition: width 0.3s; }

        .nav { display: flex; background: #222; }
        .nav button { flex: 1; padding: 12px; border: none; background: #333; color: #666; font-family: 'Press Start 2P'; font-size: 7px; cursor: pointer; }
        .nav button.active { background: var(--bg); color: var(--dark); }
        
        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; overflow-y: auto; }
        .view.active { display: flex; }
        
        canvas { background: var(--bg); border: 3px solid var(--dark); image-rendering: pixelated; display: block; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 10px; }
        .btn { background: var(--dark); color: var(--bg); border: none; width: 60px; height: 50px; font-size: 16px; border-radius: 5px; }
        
        .card { border: 2px solid var(--dark); padding: 10px; margin: 5px; width: 85%; text-align: center; background: rgba(0,0,0,0.03); flex-shrink: 0; }
        .buy-btn { background: var(--dark); color: var(--bg); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 7px; width: 100%; margin-top: 5px; cursor: pointer; }
        .buy-btn:disabled { opacity: 0.3; }

        #tap-btn { width: 120px; height: 120px; background: var(--dark); border: 6px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; border-radius: 50%; }
        
        .pop { position: absolute; font-size: 8px; pointer-events: none; animation: popUp 0.6s forwards; color: var(--dark); font-weight: bold; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

        .prestige-btn { background: #e74c3c; color: white; border: 3px solid #c0392b; padding: 10px; font-family: 'Press Start 2P'; font-size: 7px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="console">
    <div class="header">
        <div class="stats-row">
            <span>DC:<span id="dc-val">0</span></span>
            <span>X<span id="mult-val">1.0</span></span>
        </div>
        <div class="rank-info"><span id="rank-ico">🆕</span> <span id="rank-name">НОВИЧОК</span></div>
        <div class="goal-bar"><div id="goal-fill"></div></div>
    </div>

    <div class="nav">
        <button id="n-menu" class="active" onclick="showTab('menu')">ИГРЫ</button>
        <button id="n-shop" onclick="showTab('shop')">ШОП</button>
        <button onclick="tg.close()">ВЫКЛ</button>
    </div>

    <div id="v-menu" class="view active">
        <div class="card"><span>ТАП-МАСТЕР</span><button class="buy-btn" onclick="startGame('clicker')">ИГРАТЬ</button></div>
        <div class="card"><span>ЗМЕЙКА</span><button class="buy-btn" onclick="startGame('snake')">ИГРАТЬ</button></div>
        <div class="card"><span>ДЖАМПЕР</span><button class="buy-btn" onclick="startGame('jumper')">ИГРАТЬ</button></div>
        <div id="p-area"></div>
    </div>

    <div id="v-clicker" class="view">
        <div id="tap-btn" onpointerdown="doTap(event)">ТАП!</div>
        <div id="crit-msg" style="font-size: 6px; margin-top: 10px; color: #cc0000; height: 10px;"></div>
    </div>

    <div id="v-snake" class="view">
        <canvas id="snakeCanvas" width="180" height="180"></canvas>
        <div class="controls">
            <button class="btn" style="grid-column: 2" onpointerdown="setDir('up')">U</button>
            <button class="btn" style="grid-row: 2; grid-column: 1" onpointerdown="setDir('left')">L</button>
            <button class="btn" style="grid-row: 2; grid-column: 2" onpointerdown="setDir('down')">D</button>
            <button class="btn" style="grid-row: 2; grid-column: 3" onpointerdown="setDir('right')">R</button>
        </div>
    </div>

    <div id="v-jumper" class="view">
        <canvas id="jumperCanvas" width="200" height="250"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 180px;">
            <button class="btn" style="width: 85px;" onpointerdown="jDir=-1" onpointerup="jDir=0">LEFT</button>
            <button class="btn" style="width: 85px;" onpointerdown="jDir=1" onpointerup="jDir=0">RIGHT</button>
        </div>
    </div>

    <div id="v-shop" class="view" style="justify-content: flex-start; padding-top: 10px;">
        <div id="shop-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ДАННЫЕ
    let coins = parseFloat(localStorage.getItem('d_dc')) || 0;
    let prestige = parseInt(localStorage.getItem('d_pr')) || 0;
    let lvls = JSON.parse(localStorage.getItem('d_lv')) || { c_pwr:0, c_auto:0, c_crit:0, s_mult:0, s_slow:0, j_jmp:0, j_grv:0 };
    let curGame = 'clicker', gameLoop, jDir = 0;

    const ranks = [
        {c:0, n:"НОВИЧОК", i:"🆕"}, {c:1000, n:"БРОНЗА", i:"🥉"}, {c:10000, n:"СЕРЕБРО", i:"🥈"},
        {c:100000, n:"ЗОЛОТО", i:"🥇"}, {c:1000000, n:"МАСТЕР", i:"💎"}, {c:1000000000, n:"БОГ", i:"⚛️"}
    ];

    const upgrades = {
        clicker: [{id:'c_pwr', n:"СИЛА", b:100}, {id:'c_auto', n:"АВТО", b:500}, {id:'c_crit', n:"КРИТ", b:2000}],
        snake: [{id:'s_mult', n:"X2 ЕДА", b:200}, {id:'s_slow', n:"МЕДЛЕННО", b:800}],
        jumper: [{id:'j_jmp', n:"ПРЫЖОК+", b:400}, {id:'j_grv', n:"ГРАВ-", b:1000}]
    };

    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d) { try { let o=aCtx.createOscillator(), g=aCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=0.02; o.connect(g); g.connect(aCtx.destination); o.start(); o.stop(aCtx.currentTime+d); } catch(e){} }

    function updateUI() {
        let m = Math.pow(1.2, prestige);
        document.getElementById('dc-val').innerText = Math.floor(coins).toLocaleString();
        document.getElementById('mult-val').innerText = m.toFixed(1);
        
        let r = ranks[0];
        for(let x of ranks) if(coins >= x.c) r = x;
        document.getElementById('rank-ico').innerText = r.i;
        document.getElementById('rank-name').innerText = r.n;

        let prog = Math.min(100, (coins / 1000000000) * 100);
        document.getElementById('goal-fill').style.width = prog + '%';

        if(coins >= 1000000000) {
            document.getElementById('p-area').innerHTML = `<button class="prestige-btn" onclick="doPrestige()">ПРЕСТИЖ X${(m*1.2).toFixed(1)}</button>`;
        } else document.getElementById('p-area').innerHTML = '';

        localStorage.setItem('d_dc', coins);
        localStorage.setItem('d_pr', prestige);
        localStorage.setItem('d_lv', JSON.stringify(lvls));
    }

    function showTab(t) {
        clearInterval(gameLoop);
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + t).classList.add('active');
        document.getElementById('n-' + t).classList.add('active');
        if(t === 'shop') renderShop();
        updateUI();
    }

    function startGame(g) { curGame = g; showTab(g); setTimeout(() => { if(g==='snake') initSn(); if(g==='jumper') initJp(); }, 100); }

    function renderShop() {
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        let m = upgrades[curGame] ? curGame : 'clicker';
        upgrades[m].forEach((it, i) => {
            let lv = lvls[it.id], price = Math.floor(it.b * Math.pow(2, lv));
            let d = document.createElement('div'); d.className = 'card';
            d.innerHTML = `<div style="font-size:7px">${it.n} LV:${lv}</div><button class="buy-btn" id="b-${i}" onclick="buy('${m}',${i})">${price} DC</button>`;
            list.appendChild(d);
            if(coins < price) document.getElementById('b-'+i).disabled = true;
        });
    }

    function buy(m, i) {
        let it = upgrades[m][i], price = Math.floor(it.b * Math.pow(2, lvls[it.id]));
        if(coins >= price) { beep(600, 0.1); coins -= price; lvls[it.id]++; updateUI(); renderShop(); }
    }

    function doPrestige() { if(confirm("СБРОСИТЬ ВСЁ?")) { prestige++; coins=0; lvls={c_pwr:0,c_auto:0,c_crit:0,s_mult:0,s_slow:0,j_jmp:0,j_grv:0}; showTab('menu'); } }

    function doTap(e) {
        beep(400, 0.05);
        let crit = Math.random() < (lvls.c_crit * 0.05) ? 10 : 1;
        if(crit > 1) { document.getElementById('crit-msg').innerText="CRIT!"; setTimeout(()=>document.getElementById('crit-msg').innerText="", 400); }
        let gain = (1 + lvls.c_pwr) * crit * Math.pow(1.2, prestige);
        coins += gain; updateUI();
        let p = document.createElement('div'); p.className='pop'; p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px'; p.innerText='+'+Math.floor(gain); document.body.appendChild(p); setTimeout(()=>p.remove(), 600);
    }

    // SNAKE
    const sC = document.getElementById('snakeCanvas'), sX = sC.getContext('2d');
    let sn, sf, sd;
    function initSn() { sn=[{x:8,y:8}]; sf={x:4,y:4}; sd='right'; clearInterval(gameLoop); gameLoop=setInterval(drawSn, 130 + (lvls.s_slow*10)); }
    function setDir(d) { if(d=='up'&&sd!='down') sd='up'; if(d=='down'&&sd!='up') sd='down'; if(d=='left'&&sd!='right') sd='left'; if(d=='right'&&sd!='left') sd='right'; }
    function drawSn() {
        sX.fillStyle='#8bac0f'; sX.fillRect(0,0,180,180); sX.fillStyle='#0f380f'; sn.forEach(p=>sX.fillRect(p.x*10,p.y*10,9,9)); sX.strokeRect(sf.x*10,sf.y*10,9,9);
        let h={...sn[0]}; if(sd=='up') h.y--; if(sd=='down') h.y++; if(sd=='left') h.x--; if(sd=='right') h.x++;
        if(h.x==sf.x && h.y==sf.y) { beep(800, 0.1); coins += (10+(lvls.s_mult*10))*Math.pow(1.2,prestige); updateUI(); sf={x:Math.floor(Math.random()*18),y:Math.floor(Math.random()*18)}; } else sn.pop();
        if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) initSn(); else sn.unshift(h);
    }

    // JUMPER
    const jC = document.getElementById('jumperCanvas'), jX = jC.getContext('2d');
    let jp, jPlats;
    function initJp() { jp={x:90,y:150,vy:0}; jPlats=[]; for(let i=0;i<6;i++) jPlats.push({x:Math.random()*150,y:i*45,w:45,vx:Math.random()>0.8?1:0}); clearInterval(gameLoop); gameLoop=setInterval(drawJp, 30); }
    function drawJp() {
        jX.fillStyle='#8bac0f'; jX.fillRect(0,0,200,250); jX.fillStyle='#0f380f';
        jp.vy += (0.35 - lvls.j_grv*0.03); jp.y += jp.vy; jp.x += jDir * 4;
        jPlats.forEach(p => { p.x+=p.vx; if(p.x<0||p.x>155) p.vx*=-1; jX.fillRect(p.x,p.y,p.w,7); if(jp.vy>0 && jp.x+15>p.x && jp.x<p.x+p.w && jp.y+15>p.y && jp.y+15<p.y+10) { jp.vy = (-9-lvls.j_jmp*0.5); coins+=2*Math.pow(1.2,prestige); updateUI(); beep(500, 0.03); } });
        if(jp.y<80) { let d=80-jp.y; jp.y=80; jPlats.forEach(p=>{ p.y+=d; if(p.y>250) {p.y=0; p.x=Math.random()*150;} }); }
        jX.fillRect(jp.x,jp.y,15,15); if(jp.y>260) initJp(); if(jp.x<0) jp.x=200; if(jp.x>200) jp.x=0;
    }

    setInterval(() => { if(lvls.c_auto>0) { coins+=(lvls.c_auto*0.5)*Math.pow(1.2,prestige); updateUI(); } }, 1000);
    updateUI();
</script>
</body>
</html>
