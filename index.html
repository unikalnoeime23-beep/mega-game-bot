<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-color: #0f1216; --card-bg: #1c2128; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: white; margin: 0; padding: 20px; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        h1 { color: var(--main-color); text-shadow: 0 0 10px var(--main-color); }

        /* Экраны */
        .screen { display: none; width: 100%; max-width: 400px; }
        .active { display: block; }

        /* Карточки и кнопки */
        .game-card, .shop-item {
            background: var(--card-bg); border: 1px solid #30363d;
            border-radius: 16px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .currency { color: #ffd700; font-weight: bold; font-size: 20px; margin-bottom: 20px; text-align: center; }
        .btn { background: var(--main-color); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-red { background: #ff0055; color: white; margin-top: 15px; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; }

        /* Игра */
        canvas { background: #000; border: 2px solid var(--main-color); display: block; margin: 20px auto; border-radius: 8px; touch-action: none; }
        .score-display { font-size: 24px; text-align: center; margin-bottom: 10px; color: var(--main-color); }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>GAME HUB 👾</h1>
        <div class="currency">💰 Монеты: <span id="balance">0</span></div>
        
        <div class="game-card">
            <div><b>🐍 Змейка</b><br><small>Классика</small></div>
            <button class="btn" onclick="startSnake()">ИГРАТЬ</button>
        </div>

        <div class="game-card">
            <div><b>🛒 Магазин</b><br><small>Скины</small></div>
            <button class="btn" onclick="showScreen('screen-shop')" style="background: #ffd700;">ЗАЙТИ</button>
        </div>
    </div>

    <div id="screen-shop" class="screen">
        <h1>МАГАЗИН 🛒</h1>
        <div class="shop-item">
            <div><b>Голубой скин</b><br><small>Цена: 50 💰</small></div>
            <button class="btn" onclick="buySkin(50, '#00d4ff')">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div><b>Зеленый скин</b><br><small>Цена: 100 💰</small></div>
            <button class="btn" onclick="buySkin(100, '#00ff00')">КУПИТЬ</button>
        </div>
        <button class="btn-red" onclick="showScreen('screen-menu')">НАЗАД В МЕНЮ</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="score-display">Счёт: <span id="score-val">0</span></div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <button class="btn-red" onclick="finishGame()">СОХРАНИТЬ И ВЫЙТИ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = localStorage.getItem('balance') ? parseInt(localStorage.getItem('balance')) : 0;
        let snakeColor = '#00d4ff';
        document.getElementById('balance').innerText = balance;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 15; // Размер клетки
        let snake, food, dx, dy, score, gameInterval;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function buySkin(price, color) {
            if (balance >= price) {
                balance -= price;
                snakeColor = color;
                updateBalance();
                tg.HapticFeedback.notificationOccurred('success');
                alert("Скин применен!");
            } else {
                alert("Мало монет!");
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('balance', balance);
        }

        function startSnake() {
            showScreen('screen-game');
            score = 0;
            document.getElementById('score-val').innerText = score;
            snake = [{x: 10 * box, y: 10 * box}, {x: 9 * box, y: 10 * box}];
            food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
            dx = box; dy = 0;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(draw, 120);
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Еда
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x, food.y, box, box);

            // Змейка
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? snakeColor : "white";
                ctx.fillRect(part.x, part.y, box, box);
            });

            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            if (headX === food.x && headY === food.y) {
                score += 10;
                document.getElementById('score-val').innerText = score;
                food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                snake.pop();
            }

            let newHead = { x: headX, y: headY };

            if (headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height || snake.some(p => p.x === newHead.x && p.y === newHead.y)) {
                clearInterval(gameInterval);
                tg.HapticFeedback.notificationOccurred('error');
                alert("Игра окончена!");
                finishGame();
                return;
            }
            snake.unshift(newHead);
        }

        // Управление (Тапы по зонам холста)
        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            if (Math.abs(x - canvas.width/2) > Math.abs(y - canvas.height/2)) {
                if (x > canvas.width/2 && dx === 0) { dx = box; dy = 0; }
                else if (x < canvas.width/2 && dx === 0) { dx = -box; dy = 0; }
            } else {
                if (y > canvas.height/2 && dy === 0) { dy = box; dx = 0; }
                else if (y < canvas.height/2 && dy === 0) { dy = -box; dx = 0; }
            }
        });

        function finishGame() {
            clearInterval(gameInterval);
            balance += score;
            updateBalance();
            tg.sendData(JSON.stringify({game: "Snake", score: score, total_balance: balance}));
            showScreen('screen-menu');
        }
    </script>
</body>
</html>
