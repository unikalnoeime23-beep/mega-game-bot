<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-color: #0f1216; --card-bg: #1c2128; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: white; margin: 0; padding: 20px; overflow: hidden; }
        
        /* Меню и Магазин */
        .header { text-align: center; margin-bottom: 20px; }
        .currency { color: #ffd700; font-weight: bold; font-size: 20px; }
        
        .game-card, .shop-item {
            background: var(--card-bg); border: 1px solid #30363d;
            border-radius: 16px; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .btn { background: var(--main-color); color: #000; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-exit { background: #ff4444; color: white; margin-top: 15px; width: 100%; }

        /* Экраны */
        .screen { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        canvas { background: #000; border: 2px solid var(--main-color); display: block; margin: 0 auto; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <div class="header">
            <h1>GAME HUB 👾</h1>
            <div class="currency">💰 Монеты: <span id="balance">0</span></div>
        </div>
        
        <div class="game-card">
            <div><b>🐍 Змейка</b><br><small>Собери яблоки</small></div>
            <button class="btn" onclick="startSnake()">ИГРАТЬ</button>
        </div>

        <div class="game-card">
            <div><b>🛒 Магазин</b><br><small>Купить скины</small></div>
            <button class="btn" style="background: #ffd700;" onclick="showScreen('screen-shop')">ВХОД</button>
        </div>
    </div>

    <div id="screen-shop" class="screen">
        <div class="header"><h1>МАГАЗИН 🛒</h1></div>
        <div class="shop-item">
            <div><b>Синий скин</b><br><small>Цена: 50 💰</small></div>
            <button class="btn" onclick="buyItem(50, '#00d4ff')">КУПИТЬ</button>
        </div>
        <button class="btn btn-exit" onclick="showScreen('screen-menu')">НАЗАД В МЕНЮ</button>
    </div>

    <div id="screen-game" class="screen">
        <h2 id="game-title" style="text-align:center">ЗМЕЙКА</h2>
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <button class="btn btn-exit" onclick="finishGame()">СОХРАНИТЬ И ВЫЙТИ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = localStorage.getItem('balance') ? parseInt(localStorage.getItem('balance')) : 0;
        let snakeColor = '#00ff00';
        document.getElementById('balance').innerText = balance;

        // Переключение экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function buyItem(price, color) {
            if (balance >= price) {
                balance -= price;
                snakeColor = color;
                updateBalance();
                alert("Скин куплен!");
            } else {
                alert("Недостаточно монет!");
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('balance', balance);
        }

        // --- ЛОГИКА ЗМЕЙКИ ---
        let canvas = document.getElementById('snakeCanvas');
        let ctx = canvas.getContext('2d');
        let snake, food, dx, dy, gameInterval, score;

        function startSnake() {
            showScreen('screen-game');
            snake = [{x: 150, y: 150}];
            food = {x: 100, y: 100};
            dx = 10; dy = 0; score = 0;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(drawSnakeGame, 100);
        }

        function drawSnakeGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Движение
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                food = {
                    x: Math.floor(Math.random() * 29) * 10,
                    y: Math.floor(Math.random() * 29) * 10
                };
                tg.HapticFeedback.impactOccurred('light');
            } else {
                snake.pop();
            }

            // Отрисовка еды
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, 10, 10);

            // Отрисовка змейки
            ctx.fillStyle = snakeColor;
            snake.forEach(part => ctx.fillRect(part.x, part.y, 10, 10));

            // Проверка столкновений
            if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) {
                alert("Проиграл! Очки: " + score);
                finishGame();
            }
        }

        // Управление касанием (для телефона)
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            if (Math.abs(x - snake[0].x) > Math.abs(y - snake[0].y)) {
                dx = x > snake[0].x ? 10 : -10; dy = 0;
            } else {
                dy = y > snake[0].y ? 10 : -10; dx = 0;
            }
        });

        function finishGame() {
            clearInterval(gameInterval);
            balance += score;
            updateBalance();
            
            // Отправка данных боту (main.py)
            let data = { game: "snake", score: score, total_balance: balance };
            tg.sendData(JSON.stringify(data)); 
            
            showScreen('screen-menu');
        }
    </script>
</body>
</html>
