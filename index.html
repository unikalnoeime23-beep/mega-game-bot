<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub V2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --retro-green: #9bbc0f; 
            --retro-dark: #0f380f; 
            --retro-mid: #8bac0f;
            --retro-light: #cadc9f;
        }
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background: #1a1a1a; color: var(--retro-dark); 
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        /* Консольная рамка */
        .console-frame {
            flex: 1; display: flex; flex-direction: column;
            border: 10px solid #333; border-radius: 20px;
            background: var(--retro-mid); margin: 5px; box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        .header { 
            padding: 15px; text-align: center; border-bottom: 4px solid var(--retro-dark);
            background: var(--retro-green);
        }
        .balance { font-size: 14px; text-shadow: 1px 1px var(--retro-light); }

        .nav-bar { display: flex; background: #222; }
        .nav-btn { 
            flex: 1; padding: 12px 0; background: #333; border: none; color: #666; 
            font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer;
        }
        .nav-btn.active { background: var(--retro-green); color: var(--retro-dark); }

        .page { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }

        /* Игровое меню */
        .game-menu { width: 90%; margin-top: 20px; }
        .game-card { 
            background: var(--retro-green); border: 4px solid var(--retro-dark); 
            padding: 15px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--retro-dark);
        }
        .play-btn { 
            width: 100%; background: var(--retro-dark); color: var(--retro-green); 
            border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 10px; margin-top: 10px;
        }

        /* Кликер */
        #clicker-btn {
            width: 160px; height: 160px; background: var(--retro-dark); 
            margin-top: 40px; border: 8px double var(--retro-green);
            display: flex; align-items: center; justify-content: center;
            color: var(--retro-light); font-size: 14px; text-align: center;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
        }
        #clicker-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0; }

        /* Игровые холсты */
        canvas { 
            background: var(--retro-green); border: 4px solid var(--retro-dark); 
            margin-top: 10px; image-rendering: pixelated; 
        }

        /* УПРАВЛЕНИЕ ДЛЯ ВСЕХ ИГР */
        .joypad { 
            display: grid; grid-template-columns: repeat(3, 60px); 
            gap: 10px; margin: 20px 0; 
        }
        .joy-btn { 
            background: var(--retro-dark); color: var(--retro-green); 
            border: none; padding: 15px; font-size: 20px; border-radius: 10px;
            box-shadow: 0 4px #000; touch-action: manipulation;
        }
        .joy-btn:active { transform: translateY(3px); box-shadow: 0 1px #000; }

        /* Магазин */
        .shop-item { 
            width: 90%; border: 2px solid var(--retro-dark); margin-bottom: 8px; 
            padding: 10px; background: var(--retro-green); display: flex; justify-content: space-between; align-items: center;
        }

        .pop { position: absolute; font-size: 12px; pointer-events: none; animation: popUp 0.6s forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
    </style>
</head>
<body>

<div class="console-frame">
    <div class="header">
        <div class="balance">COINS: <span id="total-coins">0</span></div>
        <div id="status-text" style="font-size: 8px; margin-top: 5px; color: #405010;">SYSTEM READY...</div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" id="btn-games" onclick="showPage('games', this)">GAMES</button>
        <button class="nav-btn" id="btn-shop" onclick="showPage('shop', this)">SHOP</button>
        <button class="nav-btn" onclick="tg.close()">OFF</button>
    </div>

    <div id="games-page" class="page active">
        <div class="game-menu">
            <div class="game-card"><h3>TAP MASTER</h3><button class="play-btn" onclick="openGame('clicker')">SELECT</button></div>
            <div class="game-card"><h3>SNAKE 8BIT</h3><button class="play-btn" onclick="openGame('snake')">SELECT</button></div>
            <div class="game-card"><h3>NEON JUMP</h3><button class="play-btn" onclick="openGame('jumper')">SELECT</button></div>
        </div>
    </div>

    <div id="clicker-game" class="page">
        <div id="clicker-btn">TAP!</div>
        <div id="combo-ui" style="margin-top: 20px; font-size: 10px;">COMBO: X1</div>
    </div>

    <div id="snake-game" class="page">
        <div id="s-score" style="margin-top:10px; font-size: 10px;">SCORE: 0</div>
        <canvas id="snakeCanvas" width="220" height="220"></canvas>
        <div class="joypad">
            <button class="joy-btn" style="grid-column: 2" onmousedown="snDir='up'">↑</button>
            <button class="joy-btn" style="grid-row: 2; grid-column: 1" onmousedown="snDir='left'">←</button>
            <button class="joy-btn" style="grid-row: 2; grid-column: 2" onmousedown="snDir='down'">↓</button>
            <button class="joy-btn" style="grid-row: 2; grid-column: 3" onmousedown="snDir='right'">→</button>
        </div>
    </div>

    <div id="jumper-game" class="page">
        <div id="j-score" style="margin-top:10px; font-size: 10px;">SCORE: 0</div>
        <canvas id="jumperCanvas" width="240" height="320"></canvas>
        <div class="joypad" style="grid-template-columns: 1fr 1fr; width: 240px;">
            <button class="joy-btn" onmousedown="moveJumper(-1)" onmouseup="moveJumper(0)" ontouchstart="moveJumper(-1)" ontouchend="moveJumper(0)">LEFT</button>
            <button class="joy-btn" onmousedown="moveJumper(1)" onmouseup="moveJumper(0)" ontouchstart="moveJumper(1)" ontouchend="moveJumper(0)">RIGHT</button>
        </div>
    </div>

    <div id="shop-page" class="page">
        <div id="shop-title" style="margin: 20px 0; font-size: 10px;">SELECT GAME FIRST</div>
        <div id="shop-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseFloat(localStorage.getItem('d_coins')) || 0;
    let clickPwr = 1, clickAuto = 0, snMult = 1, snSpeed = 130, jJump = -11, jGrav = 0.5;
    let activeMode = 'menu';

    const shopData = {
        clicker: [{n:"SUPER FINGER", c:100, f:()=>clickPwr++}, {n:"AUTO BOT", c:500, f:()=>clickAuto+=2}],
        snake: [{n:"FRUIT X2", c:200, f:()=>snMult+=1}, {n:"SLOW CHIP", c:600, f:()=>snSpeed+=20}],
        jumper: [{n:"BOOTS", c:300, f:()=>jJump-=1}, {n:"MOON", c:800, f:()=>jGrav-=0.05}]
    };

    function showPage(id, btn) {
        stopAll();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id + '-page').classList.add('active');
        if(btn) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        if(id === 'shop') renderShop();
    }

    function openGame(mode) {
        activeMode = mode;
        showPage(mode);
        if(mode === 'snake') startSnake();
        if(mode === 'jumper') startJumper();
    }

    function renderShop() {
        const cont = document.getElementById('shop-content');
        cont.innerHTML = '';
        if(!shopData[activeMode]) return;
        shopData[activeMode].forEach((item, i) => {
            const d = document.createElement('div');
            d.className = 'shop-item';
            d.innerHTML = `<div style="font-size:7px"><b>${item.n}</b><br>COST: ${item.c}</div>
                           <button class="joy-btn" style="padding:5px 10px; font-size:8px" onclick="buy(${i})">BUY</button>`;
            cont.appendChild(d);
        });
    }

    function buy(i) {
        let item = shopData[activeMode][i];
        if(coins >= item.c) { coins -= item.c; item.f(); item.c = Math.floor(item.c * 1.7); updateUI(); renderShop(); }
    }

    function updateUI() { 
        document.getElementById('total-coins').innerText = Math.floor(coins).toLocaleString(); 
        localStorage.setItem('d_coins', coins);
    }

    // --- CLICKER ---
    let combo = 0, comboT;
    document.getElementById('clicker-btn').onpointerdown = (e) => {
        combo++; clearTimeout(comboT);
        comboT = setTimeout(()=>combo=0, 800);
        let m = combo > 20 ? 3 : (combo > 10 ? 2 : 1);
        coins += clickPwr * m;
        document.getElementById('combo-ui').innerText = "COMBO: X" + m;
        updateUI();
        pop(e.clientX, e.clientY, "+"+(clickPwr*m));
    };

    // --- SNAKE ---
    const snCanvas = document.getElementById('snakeCanvas');
    const snCtx = snCanvas.getContext('2d');
    let snake, snFood, snDir, snInt, snScore;
    function startSnake() {
        snake = [{x:10, y:10}]; snFood = {x:5, y:5}; snDir = 'right'; snScore = 0;
        clearInterval(snInt);
        snInt = setInterval(drawSnake, snSpeed);
    }
    function drawSnake() {
        snCtx.fillStyle = 'var(--retro-green)'; snCtx.fillRect(0,0,220,220);
        snCtx.fillStyle = 'var(--retro-dark)';
        snake.forEach(b => snCtx.fillRect(b.x*11, b.y*11, 10, 10));
        snCtx.strokeRect(snFood.x*11, snFood.y*11, 10, 10);
        
        let head = {...snake[0]};
        if(snDir=='up') head.y--; if(snDir=='down') head.y++;
        if(snDir=='left') head.x--; if(snDir=='right') head.x++;

        if(head.x==snFood.x && head.y==snFood.y) {
            coins += 10 * snMult; snScore++; updateUI();
            document.getElementById('s-score').innerText = "SCORE: " + snScore;
            snFood = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
        } else { snake.pop(); }

        if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x==head.x&&s.y==head.y)) startSnake();
        else snake.unshift(head);
    }

    // --- JUMPER ---
    const jCanvas = document.getElementById('jumperCanvas');
    const jCtx = jCanvas.getContext('2d');
    let jActive, jPlayer, jPlats, jInp = 0;
    function startJumper() {
        jActive = true; jPlayer = {x:110, y:250, vy:0}; jPlats = [];
        for(let i=0; i<6; i++) jPlats.push({x:Math.random()*180, y:i*60, w:50, vx: Math.random()>0.7?1:0});
        requestAnimationFrame(drawJumper);
    }
    function moveJumper(v) { jInp = v; }
    function drawJumper() {
        if(!jActive || activeMode !== 'jumper') return;
        jCtx.fillStyle = 'var(--retro-green)'; jCtx.fillRect(0,0,240,320);
        jPlayer.vy += jGrav; jPlayer.y += jPlayer.vy;
        jPlayer.x += jInp * 4;

        jPlats.forEach(p => {
            p.x += p.vx; if(p.x<0||p.x>190) p.vx*=-1;
            jCtx.fillStyle = 'var(--retro-dark)'; jCtx.fillRect(p.x, p.y, p.w, 8);
            if(jPlayer.vy > 0 && jPlayer.x+15 > p.x && jPlayer.x < p.x+p.w && jPlayer.y+15 > p.y && jPlayer.y+15 < p.y+10) {
                jPlayer.vy = jJump; coins += 2; updateUI();
            }
        });

        if(jPlayer.y < 120) {
            let d = 120 - jPlayer.y; jPlayer.y = 120;
            jPlats.forEach(p => { p.y += d; if(p.y > 320) { p.y = 0; p.x = Math.random()*180; p.vx = Math.random()>0.8?1.5:0; }});
        }
        jCtx.fillRect(jPlayer.x, jPlayer.y, 15, 15);
        if(jPlayer.y > 350) startJumper();
        requestAnimationFrame(drawJumper);
    }

    function stopAll() { clearInterval(snInt); jActive = false; }
    function pop(x,y,v) {
        let p = document.createElement('div'); p.className = 'pop'; p.style.left = x+'px'; p.style.top = y+'px'; p.innerText = v;
        document.body.appendChild(p); setTimeout(()=>p.remove(), 600);
    }
    
    setInterval(() => { if(clickAuto > 0) { coins += clickAuto/10; updateUI(); }}, 100);
    updateUI();
</script>
</body>
</html>
