<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Ultimate Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #f39c12; --bg: #0a0a0b; --card: #161618; --btn: #1f1f22; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

        /* Навигация */
        .nav-bar { display: flex; background: #121214; border-bottom: 2px solid #222; z-index: 1000; }
        .nav-btn { flex: 1; padding: 15px 0; background: none; border: none; color: #666; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(243, 156, 18, 0.05); }

        /* Контент */
        .page { display: none; width: 100%; height: 100%; overflow-y: auto; position: relative; }
        .page.active { display: flex; flex-direction: column; align-items: center; }

        /* Шапка баланса */
        .header { width: 100%; padding: 15px 0; background: #121214; text-align: center; border-bottom: 1px solid #222; }
        .balance { font-size: 28px; font-weight: bold; color: var(--accent); text-shadow: 0 0 15px rgba(243,156,18,0.2); }

        /* Меню выбора игр */
        .game-menu { width: 90%; padding: 20px 0; }
        .game-card { background: var(--card); border: 1px solid #222; border-radius: 16px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .game-card h3 { margin: 0; font-size: 18px; color: var(--accent); }
        .game-card p { margin: 5px 0 0; font-size: 12px; color: #888; }
        .play-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Кликер */
        #click-circle { width: 200px; height: 200px; background: radial-gradient(circle, #e74c3c, #c0392b); border-radius: 50%; margin-top: 50px; border: 8px solid #962d22; box-shadow: 0 0 40px rgba(231,76,60,0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.05s; }
        #click-circle:active { transform: scale(0.93); }

        /* Магазин */
        .shop-list { width: 90%; padding-bottom: 100px; }
        .shop-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .shop-item .info { flex: 1; }
        .shop-item strong { display: block; font-size: 14px; }
        .shop-item small { color: #666; font-size: 11px; }
        .buy-btn { background: #27ae60; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; min-width: 80px; }
        .buy-btn:disabled { background: #333; color: #666; }

        /* Игровые холсты */
        canvas { background: #000; border: 2px solid #222; border-radius: 10px; margin-top: 20px; }
        .snake-ctrl { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-top: 20px; }
        .ctrl-btn { background: var(--btn); border: 1px solid #333; color: #fff; font-size: 24px; padding: 15px; border-radius: 12px; }

        .pop { position: absolute; color: var(--accent); font-weight: bold; pointer-events: none; animation: popUp 1s forwards; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
<body>

<div class="header">
    <div class="balance"><span id="total-coins">0</span> DC</div>
    <div style="font-size: 11px; color: #555;">РЕЖИМ: <span id="current-mode">CLICKER</span></div>
</div>

<div class="nav-bar">
    <button class="nav-btn active" onclick="showPage('games', this)">🎮 ИГРЫ</button>
    <button class="nav-btn" onclick="showPage('shop', this)">🛒 МАГАЗИН</button>
    <button class="nav-btn" onclick="tg.close()" style="color: #e74c3c;">🚪 ВЫХОД</button>
</div>

<div id="games-page" class="page active">
    <div class="game-menu">
        <div class="game-card">
            <div><h3>Danila Clicker</h3><p>Классический фарм</p></div>
            <button class="play-btn" onclick="openGame('clicker')">ИГРАТЬ</button>
        </div>
        <div class="game-card">
            <div><h3>Neon Snake</h3><p>Ретро змейка со звуком</p></div>
            <button class="play-btn" onclick="openGame('snake')">ИГРАТЬ</button>
        </div>
        <div class="game-card">
            <div><h3>Square Jumper</h3><p>Следование за пальцем</p></div>
            <button class="play-btn" onclick="openGame('jumper')">ИГРАТЬ</button>
        </div>
    </div>
</div>

<div id="clicker-game" class="page">
    <div id="click-circle">CLICK</div>
</div>

<div id="snake-game" class="page">
    <canvas id="snakeCanvas" width="300" height="300"></canvas>
    <div class="snake-ctrl">
        <button class="ctrl-btn" style="grid-column: 2" onclick="snDir='up'">↑</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 1" onclick="snDir='left'">←</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 2" onclick="snDir='down'">↓</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 3" onclick="snDir='right'">→</button>
    </div>
</div>

<div id="jumper-game" class="page">
    <canvas id="jumperCanvas" width="300" height="400"></canvas>
</div>

<div id="shop-page" class="page">
    <h2 id="shop-title" style="color: var(--accent); margin-top: 20px;">МАГАЗИН</h2>
    <div class="shop-list" id="shop-content"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // СОСТОЯНИЕ
    let coins = parseFloat(localStorage.getItem('d_coins')) || 0;
    let activeMode = 'clicker';
    
    // ПАРАМЕТРЫ ИГР
    let clickPwr = 1;
    let clickAuto = 0;
    let snakeMult = 1;
    let snakeSpeed = 120;
    let jumpG = 0.5;
    let jumpBoost = -12;

    const shopData = {
        clicker: [
            { n: "Сильные пальцы", d: "+1 к клику", c: 50, f: () => clickPwr += 1 },
            { n: "Кликер-Бот", d: "+5 в сек", c: 500, f: () => clickAuto += 5 },
            { n: "Мега-Тап", d: "+10 к клику", c: 2500, f: () => clickPwr += 10 },
            { n: "Серверная", d: "+100 в сек", c: 15000, f: () => clickAuto += 100 }
        ],
        snake: [
            { n: "Питательные яблоки", d: "x2 за еду", c: 150, f: () => snakeMult += 1 },
            { n: "Слоу-мо", d: "Замедлить змейку", c: 400, f: () => snakeSpeed += 10 },
            { n: "Золотые фрукты", d: "x5 за еду", c: 2000, f: () => snakeMult += 4 }
        ],
        jumper: [
            { n: "Легкие кроссовки", d: "Прыжок выше", c: 300, f: () => jumpBoost -= 2 },
            { n: "Грави-костюм", d: "Медленное падение", c: 800, f: () => jumpG -= 0.1 },
            { n: "Магнит монет", d: "Больше DC в полете", c: 5000, f: () => {} }
        ]
    };

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id + '-page').classList.add('active');
        if(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        if(id === 'shop') renderShop();
        stopGames();
    }

    function openGame(mode) {
        activeMode = mode;
        document.getElementById('current-mode').innerText = mode.toUpperCase();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(mode + '-game').classList.add('active');
        if(mode === 'snake') initSnake();
        if(mode === 'jumper') initJumper();
    }

    function renderShop() {
        const cont = document.getElementById('shop-content');
        document.getElementById('shop-title').innerText = "МАГАЗИН: " + activeMode.toUpperCase();
        cont.innerHTML = '';
        shopData[activeMode].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="info"><strong>${item.n}</strong><small>${item.d}</small></div>
                <button class="buy-btn" onclick="buyItem('${activeMode}', ${index})" ${coins < item.c ? 'disabled' : ''}>${item.c} DC</button>
            `;
            cont.appendChild(div);
        });
    }

    function buyItem(mode, idx) {
        const item = shopData[mode][idx];
        if(coins >= item.c) {
            coins -= item.c;
            item.f();
            item.c = Math.floor(item.c * 1.6);
            updateUI();
            renderShop();
        }
    }

    function updateUI() {
        document.getElementById('total-coins').innerText = Math.floor(coins).toLocaleString();
        localStorage.setItem('d_coins', coins);
    }

    // КЛИКЕР ЛОГИКА
    document.getElementById('click-circle').onpointerdown = (e) => {
        coins += clickPwr;
        const pop = document.createElement('div');
        pop.className = 'pop';
        pop.style.left = e.clientX + 'px'; pop.style.top = e.clientY + 'px';
        pop.innerText = '+' + clickPwr;
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
        updateUI();
    };

    // ЗМЕЙКА ЛОГИКА
    const snCanvas = document.getElementById('snakeCanvas');
    const snCtx = snCanvas.getContext('2d');
    let snake, snFood, snDir, snInt;
    function initSnake() {
        snake = [{x:10, y:10}]; snFood = {x:5, y:5}; snDir = 'right';
        clearInterval(snInt);
        snInt = setInterval(drawSnake, snakeSpeed);
    }
    function drawSnake() {
        snCtx.fillStyle = '#000'; snCtx.fillRect(0,0,300,300);
        snCtx.fillStyle = '#0f0'; snake.forEach(b => snCtx.fillRect(b.x*15, b.y*15, 14, 14));
        snCtx.fillStyle = 'red'; snCtx.fillRect(snFood.x*15, snFood.y*15, 14, 14);
        let head = {...snake[0]};
        if(snDir=='up') head.y--; if(snDir=='down') head.y++;
        if(snDir=='left') head.x--; if(snDir=='right') head.x++;
        if(head.x==snFood.x && head.y==snFood.y) {
            coins += 10 * snakeMult; updateUI();
            snFood = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
        } else { snake.pop(); }
        if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x==head.x&&s.y==head.y)) { initSnake(); return; }
        snake.unshift(head);
    }

    // ДЖАМПЕР ЛОГИКА
    const jmCanvas = document.getElementById('jumperCanvas');
    const jmCtx = jmCanvas.getContext('2d');
    let jActive, jPlayer, jPlats;
    function initJumper() {
        jActive = true; jPlayer = {x:140, y:300, vy:0};
        jPlats = [{x:100, y:380, w:100}];
        for(let i=0; i<6; i++) jPlats.push({x:Math.random()*230, y:i*70, w:70});
        requestAnimationFrame(drawJumper);
    }
    function drawJumper() {
        if(!jActive || activeMode !== 'jumper') return;
        jmCtx.fillStyle = '#050505'; jmCtx.fillRect(0,0,300,400);
        jPlayer.vy += jumpG; jPlayer.y += jPlayer.vy;
        jmCtx.fillStyle = '#3498db';
        jPlats.forEach(p => {
            jmCtx.fillRect(p.x, p.y, p.w, 10);
            if(jPlayer.vy > 0 && jPlayer.x+20 > p.x && jPlayer.x < p.x+p.w && jPlayer.y+20 > p.y && jPlayer.y+20 < p.y+15) {
                jPlayer.vy = jumpBoost; coins += 2; updateUI();
            }
        });
        if(jPlayer.y < 150) { 
            let d = 150 - jPlayer.y; jPlayer.y = 150; 
            jPlats.forEach(p => { p.y += d; if(p.y > 400) { p.y = 0; p.x = Math.random()*230; }});
        }
        jmCtx.fillStyle = '#e74c3c'; jmCtx.fillRect(jPlayer.x, jPlayer.y, 20, 20);
        if(jPlayer.y > 420) initJumper();
        requestAnimationFrame(drawJumper);
    }
    jmCanvas.addEventListener('touchmove', (e) => {
        let rect = jmCanvas.getBoundingClientRect();
        jPlayer.x = e.touches[0].clientX - rect.left - 10;
    });

    function stopGames() {
        clearInterval(snInt);
        jActive = false;
    }

    setInterval(() => { if(clickAuto > 0) { coins += clickAuto / 10; updateUI(); }}, 100);

    updateUI();
</script>
</body>
</html>
