<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub: Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; }
        body { font-family: 'Press Start 2P', cursive; background: #1a1a1a; color: var(--dark); margin: 0; padding: 0; height: 100vh; overflow: hidden; touch-action: none; }
        .console { flex: 1; background: var(--bg); margin: 8px; border: 8px solid #333; border-radius: 15px; display: flex; flex-direction: column; height: calc(100vh - 16px); position: relative; }
        
        .header { padding: 8px; border-bottom: 3px solid var(--dark); background: rgba(0,0,0,0.05); flex-shrink: 0; }
        .stats { display: flex; justify-content: space-between; font-size: 7px; margin-bottom: 5px; }
        .rank { font-size: 8px; color: #304010; }

        .nav { display: flex; background: #222; flex-shrink: 0; }
        .nav button { flex: 1; padding: 15px; border: none; background: #333; color: #666; font-family: 'Press Start 2P'; font-size: 7px; cursor: pointer; }
        .nav button.active { background: var(--bg); color: var(--dark); }
        
        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        .view.active { display: flex; }
        
        canvas { background: var(--bg); border: 4px solid var(--dark); image-rendering: pixelated; display: block; max-width: 90%; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 15px; }
        .btn { background: var(--dark); color: var(--bg); border: none; width: 60px; height: 55px; font-size: 14px; border-radius: 8px; box-shadow: 0 4px #000; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #000; }
        
        .card { border: 3px solid var(--dark); padding: 12px; margin: 8px 0; width: 85%; text-align: center; background: rgba(0,0,0,0.03); }
        .buy-btn { background: var(--dark); color: var(--bg); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 8px; width: 100%; margin-top: 8px; cursor: pointer; }
        .buy-btn:disabled { opacity: 0.3; cursor: default; }

        #tap-btn { width: 130px; height: 130px; background: var(--dark); border: 8px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 50%; cursor: pointer; text-align: center; }
        
        .pop { position: absolute; font-size: 10px; pointer-events: none; animation: popUp 0.6s forwards; color: var(--dark); font-weight: bold; z-index: 1000; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

        .prestige-btn { background: #e74c3c; color: white; border: 4px solid #c0392b; padding: 15px; font-family: 'Press Start 2P'; font-size: 8px; margin-top: 15px; cursor: pointer; width: 85%; }
    </style>
</head>
<body>

<div class="console">
    <div class="header">
        <div class="stats">
            <span>DC:<span id="dc-val">0</span></span>
            <span>X<span id="mult-val">1.0</span></span>
        </div>
        <div class="rank"><span id="rank-ico">🆕</span> <span id="rank-name">НОВИЧОК</span></div>
    </div>

    <div class="nav">
        <button id="n-menu" class="active" onclick="showTab('menu')">ИГРЫ</button>
        <button id="n-shop" onclick="showTab('shop')">ШОП</button>
        <button onclick="tg.close()">ВЫКЛ</button>
    </div>

    <div id="v-menu" class="view active">
        <div class="card"><span>КЛИКЕР</span><button class="buy-btn" onclick="startGame('clicker')">ИГРАТЬ</button></div>
        <div class="card"><span>ЗМЕЙКА</span><button class="buy-btn" onclick="startGame('snake')">ИГРАТЬ</button></div>
        <div class="card"><span>ПРЫЖОК</span><button class="buy-btn" onclick="startGame('jumper')">ИГРАТЬ</button></div>
        <div id="p-area"></div>
    </div>

    <div id="v-clicker" class="view">
        <div id="tap-btn" onpointerdown="doTap(event)">ТАП!</div>
        <div id="crit-msg" style="margin-top:15px; height:10px; color:#c0392b; font-size:8px;"></div>
    </div>

    <div id="v-snake" class="view">
        <canvas id="snakeCanvas" width="180" height="180"></canvas>
        <div class="controls">
            <button class="btn" style="grid-column: 2" onpointerdown="setDir('up')">↑</button>
            <button class="btn" style="grid-row: 2; grid-column: 1" onpointerdown="setDir('left')">←</button>
            <button class="btn" style="grid-row: 2; grid-column: 2" onpointerdown="setDir('down')">↓</button>
            <button class="btn" style="grid-row: 2; grid-column: 3" onpointerdown="setDir('right')">→</button>
        </div>
    </div>

    <div id="v-jumper" class="view">
        <canvas id="jumperCanvas" width="200" height="250"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 200px;">
            <button class="btn" style="width: 90px;" onpointerdown="jDir=-1" onpointerup="jDir=0">ЛЕВО</button>
            <button class="btn" style="width: 90px;" onpointerdown="jDir=1" onpointerup="jDir=0">ПРАВО</button>
        </div>
    </div>

    <div id="v-shop" class="view" style="justify-content: flex-start; padding-top: 15px;">
        <div id="shop-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseFloat(localStorage.getItem('danila_coins')) || 0;
    let prestige = parseInt(localStorage.getItem('danila_prestige')) || 0;
    let lvls = JSON.parse(localStorage.getItem('danila_lvls')) || { c_pwr:0, c_auto:0, c_crit:0, s_mult:0, s_slow:0, j_jmp:0, j_grv:0 };
    
    let curGame = 'clicker', gameLoop, jDir = 0;

    const ranks = [
        {c:0, n:"НОВИЧОК", i:"🆕"}, {c:1000, n:"БРОНЗА", i:"🥉"}, {c:10000, n:"СЕРЕБРО", i:"🥈"},
        {c:100000, n:"ЗОЛОТО", i:"🥇"}, {c:1000000, n:"МАСТЕР", i:"💎"}, {c:1000000000, n:"БОГ", i:"⚛️"}
    ];

    const upgrades = {
        clicker: [{id:'c_pwr', n:"СИЛА", b:100}, {id:'c_auto', n:"АВТО", b:500}, {id:'c_crit', n:"КРИТ", b:2000}],
        snake: [{id:'s_mult', n:"X2 ЕДА", b:200}, {id:'s_slow', n:"МЕДЛЕННО", b:800}],
        jumper: [{id:'j_jmp', n:"ПРЫЖОК+", b:400}, {id:'j_grv', n:"ГРАВ-", b:1000}]
    };

    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d) { try { let o=aCtx.createOscillator(), g=aCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=0.02; o.connect(g); g.connect(aCtx.destination); o.start(); o.stop(aCtx.currentTime+d); } catch(e){} }

    function updateUI() {
        let m = Math.pow(1.2, prestige);
        document.getElementById('dc-val').innerText = Math.floor(coins).toLocaleString();
        document.getElementById('mult-val').innerText = m.toFixed(1);
        
        let r = ranks[0];
        for(let x of ranks) if(coins >= x.c) r = x;
        document.getElementById('rank-ico').innerText = r.i;
        document.getElementById('rank-name').innerText = r.n;

        if(coins >= 1000000000) {
            document.getElementById('p-area').innerHTML = `<button class="prestige-btn" onclick="doPrestige()">АКТИВИРОВАТЬ ПРЕСТИЖ X${(m*1.2).toFixed(1)}</button>`;
        } else document.getElementById('p-area').innerHTML = '';

        localStorage.setItem('danila_coins', coins);
        localStorage.setItem('danila_prestige', prestige);
        localStorage.setItem('danila_lvls', JSON.stringify(lvls));
    }

    function showTab(t) {
        clearInterval(gameLoop);
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + t).classList.add('active');
        document.getElementById('n-' + t).classList.add('active');
        if(t === 'shop') renderShop();
        updateUI();
    }

    function startGame(g) {
        curGame = g;
        showTab(g);
        setTimeout(() => {
            if(g === 'snake') initSn();
            if(g === 'jumper') initJp();
        }, 50);
    }

    function renderShop() {
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        let m = upgrades[curGame] || upgrades.clicker;
        upgrades[m===upgrades.clicker?'clicker':curGame].forEach((it, i) => {
            let lv = lvls[it.id], price = Math.floor(it.b * Math.pow(2.2, lv));
            let d = document.createElement('div'); d.className = 'card';
            d.innerHTML = `<div style="font-size:7px">${it.n} [LV:${lv}]</div><button class="buy-btn" id="b-${i}" onclick="buy('${it.id}',${price})">${price} DC</button>`;
            list.appendChild(d);
            if(coins < price) document.getElementById('b-'+i).disabled = true;
        });
    }

    function buy(id, price) {
        if(coins >= price) { beep(600, 0.1); coins -= price; lvls[id]++; updateUI(); renderShop(); }
    }

    function doPrestige() { if(confirm("Сбросить прогресс ради множителя?")) { prestige++; coins=0; lvls={c_pwr:0,c_auto:0,c_crit:0,s_mult:0,s_slow:0,j_jmp:0,j_grv:0}; showTab('menu'); } }

    function doTap(e) {
        beep(400, 0.05);
        let crit = Math.random() < (lvls.c_crit * 0.05) ? 10 : 1;
        if(crit > 1) { document.getElementById('crit-msg').innerText="КРИТ X10!"; setTimeout(()=>document.getElementById('crit-msg').innerText="", 500); }
        let gain = (1 + lvls.c_pwr) * crit * Math.pow(1.2, prestige);
        coins += gain; updateUI();
        let p = document.createElement('div'); p.className='pop'; 
        p.style.left=(e.clientX || e.touches[0].clientX)+'px'; 
        p.style.top=(e.clientY || e.touches[0].clientY)+'px'; 
        p.innerText='+'+Math.floor(gain); document.body.appendChild(p); setTimeout(()=>p.remove(), 600);
    }

    // --- ЗМЕЙКА ---
    let sC, sX, sn, sf, sd;
    function initSn() {
        sC = document.getElementById('snakeCanvas'); sX = sC.getContext('2d');
        sn=[{x:8,y:8}]; sf={x:4,y:4}; sd='right';
        clearInterval(gameLoop); gameLoop=setInterval(drawSn, 140 + (lvls.s_slow*15));
    }
    function setDir(d) { if(d=='up'&&sd!='down') sd='up'; if(d=='down'&&sd!='up') sd='down'; if(d=='left'&&sd!='right') sd='left'; if(d=='right'&&sd!='left') sd='right'; }
    function drawSn() {
        sX.fillStyle='#8bac0f'; sX.fillRect(0,0,180,180);
        sX.fillStyle='#0f380f'; sn.forEach(p=>sX.fillRect(p.x*10,p.y*10,9,9));
        sX.strokeStyle='#0f380f'; sX.strokeRect(sf.x*10,sf.y*10,9,9);
        let h={...sn[0]}; if(sd=='up') h.y--; if(sd=='down') h.y++; if(sd=='left') h.x--; if(sd=='right') h.x++;
        if(h.x==sf.x && h.y==sf.y) { beep(800, 0.1); coins += (15+(lvls.s_mult*15))*Math.pow(1.2,prestige); updateUI(); sf={x:Math.floor(Math.random()*18),y:Math.floor(Math.random()*18)}; } else sn.pop();
        if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) initSn(); else sn.unshift(h);
    }

    // --- ДЖАМПЕР ---
    let jC, jX, jp, jPlats;
    function initJp() {
        jC = document.getElementById('jumperCanvas'); jX = jC.getContext('2d');
        jp={x:90,y:150,vy:0}; jPlats=[];
        for(let i=0;i<6;i++) jPlats.push({x:Math.random()*150,y:i*45,w:45,vx:Math.random()>0.8?1:0});
        clearInterval(gameLoop); gameLoop=setInterval(drawJp, 30);
    }
    function drawJp() {
        jX.fillStyle='#8bac0f'; jX.fillRect(0,0,200,250);
        jX.fillStyle='#0f380f';
        jp.vy += (0.35 - lvls.j_grv*0.04); jp.y += jp.vy; jp.x += jDir * 5;
        jPlats.forEach(p => {
            p.x+=p.vx; if(p.x<0||p.x>155) p.vx*=-1;
            jX.fillRect(p.x,p.y,p.w,8);
            if(jp.vy>0 && jp.x+15>p.x && jp.x<p.x+p.w && jp.y+15>p.y && jp.y+15<p.y+12) {
                jp.vy = (-9.5 - lvls.j_jmp*0.6); coins += (5 + lvls.j_jmp)*Math.pow(1.2,prestige); updateUI(); beep(500, 0.03);
            }
        });
        if(jp.y<80) { let d=80-jp.y; jp.y=80; jPlats.forEach(p=>{ p.y+=d; if(p.y>250){p.y=0; p.x=Math.random()*150;} }); }
        jX.fillRect(jp.x,jp.y,15,15);
        if(jp.y>260) initJp();
        if(jp.x<0) jp.x=200; if(jp.x>200) jp.x=0;
    }

    setInterval(() => { if(lvls.c_auto>0) { coins += (lvls.c_auto * 1.5) * Math.pow(1.2, prestige); updateUI(); } }, 1000);
    updateUI();
</script>
</body>
</html>
