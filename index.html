<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let balance = localStorage.getItem('balance') ? parseInt(localStorage.getItem('balance')) : 0;
    let snakeColor = '#00d4ff'; // Цвет по умолчанию
    document.getElementById('balance').innerText = balance;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let snake, food, dx, dy, score, gameInterval;
    const box = 20; // Размер одной ячейки (сетка)

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startSnake() {
        showScreen('screen-game');
        
        // Начальные настройки
        score = 0;
        document.getElementById('score-val').innerText = score;
        
        // Змейка в центре
        snake = [{x: 10 * box, y: 10 * box}]; 
        food = {
            x: Math.floor(Math.random() * 14 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        
        dx = box; // Начальное движение вправо
        dy = 0;

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(draw, 150); // Скорость змейки (150мс)
    }

    function draw() {
        // Очистка поля
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Рисуем еду
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(food.x, food.y, box, box);

        // Рисуем змейку
        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i === 0) ? snakeColor : "#ffffff"; // Голова другого цвета
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
            ctx.strokeStyle = "black";
            ctx.strokeRect(snake[i].x, snake[i].y, box, box);
        }

        // Логика движения
        let snakeX = snake[0].x + dx;
        let snakeY = snake[0].y + dy;

        // Если съели еду
        if (snakeX === food.x && snakeY === food.y) {
            score += 10;
            document.getElementById('score-val').innerText = score;
            tg.HapticFeedback.impactOccurred('light');
            food = {
                x: Math.floor(Math.random() * 14 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
        } else {
            snake.pop(); // Удаляем хвост
        }

        let newHead = { x: snakeX, y: snakeY };

        // Проверка столкновений (стены или хвост)
        if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
            clearInterval(gameInterval);
            tg.HapticFeedback.notificationOccurred('error');
            alert("ИГРА ОКОНЧЕНА! Счёт: " + score);
            finishGame();
        }

        snake.unshift(newHead); // Добавляем новую голову
    }

    function collision(head, array) {
        for (let i = 0; i < array.length; i++) {
            if (head.x === array[i].x && head.y === array[i].y) return true;
        }
        return false;
    }

    // Управление тапами (делим экран на 4 зоны)
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;

        // Простая логика: если нажали в правой части холста - поворот вправо и т.д.
        if (Math.abs(x - (canvas.width/2)) > Math.abs(y - (canvas.height/2))) {
            if (x > canvas.width/2 && dx === 0) { dx = box; dy = 0; }
            else if (x < canvas.width/2 && dx === 0) { dx = -box; dy = 0; }
        } else {
            if (y > canvas.height/2 && dy === 0) { dy = box; dx = 0; }
            else if (y < canvas.height/2 && dy === 0) { dy = -box; dx = 0; }
        }
    });

    function finishGame() {
        clearInterval(gameInterval);
        balance += score;
        localStorage.setItem('balance', balance);
        
        let data = {
            game: "Змейка",
            score: score,
            total_balance: balance
        };
        tg.sendData(JSON.stringify(data)); 
        showScreen('screen-menu');
    }
</script>
