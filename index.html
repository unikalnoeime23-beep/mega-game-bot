<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Retro Hub 1990</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --retro-green: #8bac0f; 
            --retro-dark: #0f380f; 
            --retro-light: #9bbc0f;
            --retro-text: #306230;
        }
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background: #202020; 
            color: var(--retro-dark); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
        }

        /* Дизайн консоли */
        .header { 
            background: var(--retro-green); 
            padding: 20px 10px; 
            text-align: center; 
            border-bottom: 6px solid var(--retro-dark);
        }
        .balance { font-size: 16px; margin-bottom: 5px; }
        .combo-meter { font-size: 10px; color: #e74c3c; min-height: 12px; }

        .nav-bar { 
            display: flex; 
            background: #404040; 
            border-bottom: 4px solid #000;
        }
        .nav-btn { 
            flex: 1; padding: 12px 0; background: #606060; border: none; 
            color: #ccc; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer;
            border-right: 2px solid #000;
        }
        .nav-btn.active { background: var(--retro-light); color: var(--retro-dark); }

        .page { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; background: var(--retro-light); position: relative; }
        .page.active { display: flex; }

        /* Игровое меню */
        .game-menu { width: 90%; padding-top: 20px; }
        .game-card { 
            background: var(--retro-green); border: 4px solid var(--retro-dark); 
            padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; 
        }
        .game-card h3 { font-size: 12px; margin: 0; }
        .game-card p { font-size: 8px; margin: 10px 0; }
        .play-btn { background: var(--retro-dark); color: var(--retro-light); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer; }

        /* Ретро Кликер */
        #click-area {
            width: 180px; height: 180px; 
            background: var(--retro-dark); 
            margin-top: 40px; 
            border: 10px double var(--retro-green);
            display: flex; align-items: center; justify-content: center;
            color: var(--retro-light); font-size: 20px;
            animation: bounce 0.1s infinite paused;
        }
        #click-area:active { transform: scale(0.95); background: var(--retro-green); color: var(--retro-dark); }

        /* Магазин */
        .shop-list { width: 95%; padding-top: 10px; }
        .shop-item { 
            border: 2px solid var(--retro-dark); margin-bottom: 8px; 
            padding: 8px; display: flex; justify-content: space-between; align-items: center;
            background: var(--retro-green);
        }
        .shop-item .info { font-size: 8px; line-height: 1.4; }
        .buy-btn { background: var(--retro-dark); color: var(--retro-light); border: none; font-size: 8px; padding: 10px 5px; font-family: 'Press Start 2P'; }
        .buy-btn:disabled { opacity: 0.3; }

        /* Холсты */
        canvas { border: 4px solid var(--retro-dark); background: var(--retro-green); image-rendering: pixelated; margin-top: 10px;}
        .snake-ctrl { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; margin-top: 10px; }
        .ctrl-btn { background: var(--retro-dark); color: var(--retro-green); border: none; padding: 15px; font-size: 14px; }

        .pop { position: absolute; font-size: 12px; pointer-events: none; animation: popUp 0.8s forwards; font-weight: bold; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }
    </style>
</head>
<body>

<div class="header">
    <div class="balance"><span id="total-coins">0</span> DC</div>
    <div class="combo-meter" id="combo-text"></div>
</div>

<div class="nav-bar">
    <button class="nav-btn active" onclick="showPage('games', this)">GAMES</button>
    <button class="nav-btn" onclick="showPage('shop', this)">SHOP</button>
    <button class="nav-btn" onclick="tg.close()">EXIT</button>
</div>

<div id="games-page" class="page active">
    <div class="game-menu">
        <div class="game-card">
            <h3>PIXEL CLICKER</h3>
            <p>BUILD YOUR COMBO!</p>
            <button class="play-btn" onclick="openGame('clicker')">SELECT</button>
        </div>
        <div class="game-card">
            <h3>SNAKE 1997</h3>
            <p>CLASSIC NOSTALGIA</p>
            <button class="play-btn" onclick="openGame('snake')">SELECT</button>
        </div>
        <div class="game-card">
            <h3>SKY JUMPER</h3>
            <p>WATCH THE SPRINGS!</p>
            <button class="play-btn" onclick="openGame('jumper')">SELECT</button>
        </div>
    </div>
</div>

<div id="clicker-game" class="page">
    <div id="click-area">PUSH</div>
    <p style="font-size: 8px; margin-top: 20px;">CLICK FAST FOR COMBO!</p>
</div>

<div id="snake-game" class="page">
    <canvas id="snakeCanvas" width="240" height="240"></canvas>
    <div class="snake-ctrl">
        <button class="ctrl-btn" style="grid-column: 2" onclick="snDir='up'">U</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 1" onclick="snDir='left'">L</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 2" onclick="snDir='down'">D</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 3" onclick="snDir='right'">R</button>
    </div>
</div>

<div id="jumper-game" class="page">
    <canvas id="jumperCanvas" width="280" height="380"></canvas>
    <p style="font-size: 8px; margin-top: 10px;">SLIDE TO MOVE</p>
</div>

<div id="shop-page" class="page">
    <p id="shop-title" style="font-size: 10px; margin: 15px 0;">SELECT A GAME FIRST</p>
    <div class="shop-list" id="shop-content"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseFloat(localStorage.getItem('d_coins')) || 0;
    let activeMode = 'clicker';
    
    // Механика Комбо
    let combo = 0;
    let comboTimer = null;

    // Параметры
    let clickPwr = 1;
    let clickAuto = 0;
    let snakeMult = 1;
    let snakeSpeed = 120;
    let jumpG = 0.5;
    let jumpBoost = -12;

    const shopData = {
        clicker: [
            { n: "CPU 8-BIT", d: "+1 POWER", c: 50, f: () => clickPwr += 1 },
            { n: "AUTO-SCRIPT", d: "+5/SEC", c: 400, f: () => clickAuto += 5 },
            { n: "CPU 16-BIT", d: "+10 POWER", c: 2000, f: () => clickPwr += 10 }
        ],
        snake: [
            { n: "FAST DIGEST", d: "X2 POINTS", c: 200, f: () => snakeMult += 1 },
            { n: "OLD CHIP", d: "SLOWER SNAKE", c: 500, f: () => snakeSpeed += 15 }
        ],
        jumper: [
            { n: "BIG SPRING", d: "JUMP +2", c: 300, f: () => jumpBoost -= 2 },
            { n: "MOON GRAV", d: "GRAVITY -0.1", c: 700, f: () => jumpG -= 0.1 }
        ]
    };

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id + '-page').classList.add('active');
        if(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        if(id === 'shop') renderShop();
        stopGames();
    }

    function openGame(mode) {
        activeMode = mode;
        showPage(mode);
        if(mode === 'snake') initSnake();
        if(mode === 'jumper') initJumper();
    }

    function renderShop() {
        const cont = document.getElementById('shop-content');
        document.getElementById('shop-title').innerText = "SHOP: " + activeMode.toUpperCase();
        cont.innerHTML = '';
        shopData[activeMode].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="info"><strong>${item.n}</strong><br>${item.d}</div>
                <button class="buy-btn" onclick="buyItem('${activeMode}', ${index})" ${coins < item.c ? 'disabled' : ''}>${item.c} DC</button>
            `;
            cont.appendChild(div);
        });
    }

    function buyItem(mode, idx) {
        const item = shopData[mode][idx];
        if(coins >= item.c) {
            coins -= item.c;
            item.f();
            item.c = Math.floor(item.c * 1.8);
            updateUI();
            renderShop();
        }
    }

    function updateUI() {
        document.getElementById('total-coins').innerText = Math.floor(coins).toLocaleString();
        localStorage.setItem('d_coins', coins);
    }

    // CLICKER LOGIC
    document.getElementById('click-area').onpointerdown = (e) => {
        combo++;
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; document.getElementById('combo-text').innerText = ""; }, 1200);

        let comboBonus = 1;
        if(combo > 10) comboBonus = 2;
        if(combo > 30) comboBonus = 5;

        if(comboBonus > 1) document.getElementById('combo-text').innerText = "COMBO X" + comboBonus;

        let totalGain = clickPwr * comboBonus;
        coins += totalGain;

        const pop = document.createElement('div');
        pop.className = 'pop';
        pop.style.left = e.clientX + 'px'; pop.style.top = e.clientY + 'px';
        pop.style.color = comboBonus > 1 ? "#e74c3c" : "var(--retro-dark)";
        pop.innerText = '+' + totalGain;
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 800);
        updateUI();
    };

    // SNAKE LOGIC
    const snCanvas = document.getElementById('snakeCanvas');
    const snCtx = snCanvas.getContext('2d');
    let snake, snFood, snDir, snInt;
    function initSnake() {
        snake = [{x:10, y:10}]; snFood = {x:5, y:5}; snDir = 'right';
        clearInterval(snInt);
        snInt = setInterval(drawSnake, snakeSpeed);
    }
    function drawSnake() {
        snCtx.fillStyle = 'var(--retro-green)'; snCtx.fillRect(0,0,240,240);
        snCtx.fillStyle = 'var(--retro-dark)'; 
        snake.forEach(b => snCtx.fillRect(b.x*12, b.y*12, 11, 11));
        snCtx.strokeStyle = 'var(--retro-dark)';
        snCtx.strokeRect(snFood.x*12, snFood.y*12, 11, 11);
        
        let head = {...snake[0]};
        if(snDir=='up') head.y--; if(snDir=='down') head.y++;
        if(snDir=='left') head.x--; if(snDir=='right') head.x++;
        
        if(head.x==snFood.x && head.y==snFood.y) {
            coins += 15 * snakeMult; updateUI();
            snFood = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
        } else { snake.pop(); }
        if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x==head.x&&s.y==head.y)) { initSnake(); return; }
        snake.unshift(head);
    }

    // JUMPER LOGIC
    const jmCanvas = document.getElementById('jumperCanvas');
    const jmCtx = jmCanvas.getContext('2d');
    let jActive, jPlayer, jPlats;
    function initJumper() {
        jActive = true; jPlayer = {x:130, y:300, vy:0};
        jPlats = [];
        for(let i=0; i<7; i++) {
            jPlats.push({
                x:Math.random()*210, 
                y:i*60, 
                w:60, 
                type: Math.random() > 0.9 ? 'spring' : 'normal',
                vx: Math.random() > 0.7 ? 2 : 0 // Движущиеся платформы
            });
        }
        requestAnimationFrame(drawJumper);
    }
    function drawJumper() {
        if(!jActive || activeMode !== 'jumper') return;
        jmCtx.fillStyle = 'var(--retro-green)'; jmCtx.fillRect(0,0,280,380);
        
        jPlayer.vy += jumpG; jPlayer.y += jPlayer.vy;
        
        jmCtx.fillStyle = 'var(--retro-dark)';
        jPlats.forEach(p => {
            if(p.vx !== 0) {
                p.x += p.vx;
                if(p.x <= 0 || p.x >= 220) p.vx *= -1;
            }

            if(p.type === 'spring') jmCtx.fillStyle = '#e74c3c';
            else jmCtx.fillStyle = 'var(--retro-dark)';
            
            jmCtx.fillRect(p.x, p.y, p.w, 8);
            
            // Коллизия
            if(jPlayer.vy > 0 && jPlayer.x+20 > p.x && jPlayer.x < p.x+p.w && jPlayer.y+20 > p.y && jPlayer.y+20 < p.y+12) {
                jPlayer.vy = p.type === 'spring' ? jumpBoost * 2.5 : jumpBoost;
                coins += 2; updateUI();
            }
        });

        // Скроллинг
        if(jPlayer.y < 160) { 
            let d = 160 - jPlayer.y; jPlayer.y = 160; 
            jPlats.forEach(p => { 
                p.y += d; 
                if(p.y > 380) { 
                    p.y = 0; p.x = Math.random()*210; 
                    p.type = Math.random() > 0.9 ? 'spring' : 'normal';
                }
            });
        }

        // Игрок
        jmCtx.fillRect(jPlayer.x, jPlayer.y, 18, 18);
        jmCtx.strokeRect(jPlayer.x-2, jPlayer.y-2, 22, 22);

        if(jPlayer.y > 400) initJumper();
        requestAnimationFrame(drawJumper);
    }
    
    jmCanvas.addEventListener('touchmove', (e) => {
        let rect = jmCanvas.getBoundingClientRect();
        jPlayer.x = (e.touches[0].clientX - rect.left) - 10;
    });

    function stopGames() {
        clearInterval(snInt);
        jActive = false;
    }

    setInterval(() => { if(clickAuto > 0) { coins += clickAuto / 10; updateUI(); }}, 100);
    updateUI();
</script>
</body>
</html>
