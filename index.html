<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub 1990</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --retro-green: #8bac0f; 
            --retro-dark: #0f380f; 
            --retro-light: #9bbc0f;
        }
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background: #222; 
            color: var(--retro-dark); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
        }

        /* Шапка консоли */
        .header { 
            background: var(--retro-green); 
            padding: 15px 10px; 
            text-align: center; 
            border-bottom: 5px solid var(--retro-dark);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
        }
        .balance { font-size: 14px; margin-bottom: 8px; }
        .combo-info { font-size: 10px; color: #cc0000; height: 12px; }

        .nav-bar { display: flex; background: #333; border-bottom: 3px solid #000; }
        .nav-btn { 
            flex: 1; padding: 12px 0; background: #444; border: none; 
            color: #888; font-family: 'Press Start 2P'; font-size: 8px; cursor: pointer;
            border-right: 1px solid #000;
        }
        .nav-btn.active { background: var(--retro-light); color: var(--retro-dark); }

        .page { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; background: var(--retro-light); overflow-y: auto; }
        .page.active { display: flex; }

        /* Меню игр */
        .game-menu { width: 90%; padding: 20px 0; }
        .game-card { 
            background: var(--retro-green); border: 4px solid var(--retro-dark); 
            padding: 15px; margin-bottom: 12px;
        }
        .game-card h3 { font-size: 12px; margin: 0 0 10px; }
        .game-card p { font-size: 8px; margin-bottom: 15px; line-height: 1.5; }
        .play-btn { 
            background: var(--retro-dark); color: var(--retro-light); 
            border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 10px; width: 100%;
        }

        /* КЛИКЕР: Шкала Combo */
        #click-button {
            width: 180px; height: 180px; background: var(--retro-dark); 
            margin-top: 30px; border-radius: 10px; border: 6px double var(--retro-green);
            display: flex; align-items: center; justify-content: center;
            color: var(--retro-light); font-size: 18px; text-align: center;
        }
        #click-button:active { transform: scale(0.95); }
        .combo-bar-container { width: 200px; height: 10px; border: 2px solid var(--retro-dark); margin-top: 15px; background: var(--retro-green); }
        #combo-fill { width: 0%; height: 100%; background: var(--retro-dark); transition: width 0.1s; }

        /* МАГАЗИН */
        .shop-list { width: 95%; padding: 15px 0 100px; }
        .shop-item { 
            border: 2px solid var(--retro-dark); margin-bottom: 10px; 
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            background: var(--retro-green);
        }
        .buy-btn { background: var(--retro-dark); color: var(--retro-light); border: none; font-size: 8px; padding: 8px; font-family: 'Press Start 2P'; }
        .buy-btn:disabled { opacity: 0.3; }

        /* Холсты */
        canvas { border: 4px solid var(--retro-dark); background: var(--retro-green); image-rendering: pixelated; margin-top: 10px;}
        .snake-ctrl { display: grid; grid-template-columns: repeat(3, 65px); gap: 5px; margin-top: 10px; }
        .ctrl-btn { background: var(--retro-dark); color: var(--retro-green); border: none; padding: 15px; font-size: 14px; border-radius: 5px; }

        .pop { position: absolute; font-size: 10px; pointer-events: none; animation: popUp 0.7s forwards; color: var(--retro-dark); }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
    </style>
</head>
<body>

<div class="header">
    <div class="balance"><span id="total-coins">0</span> DC</div>
    <div class="combo-info" id="combo-text"></div>
    <div class="combo-bar-container"><div id="combo-fill"></div></div>
</div>

<div class="nav-bar">
    <button class="nav-btn active" onclick="showPage('games', this)">GAMES</button>
    <button class="nav-btn" onclick="showPage('shop', this)">SHOP</button>
    <button class="nav-btn" onclick="tg.close()" style="color:#ff5555">EXIT</button>
</div>

<div id="games-page" class="page active">
    <div class="game-menu">
        <div class="game-card">
            <h3>PIXEL TAP</h3>
            <p>TAP FAST FOR X5 BONUS!</p>
            <button class="play-btn" onclick="openGame('clicker')">SELECT</button>
        </div>
        <div class="game-card">
            <h3>SNAKE 8-BIT</h3>
            <p>CLASSIC RETRO FUN</p>
            <button class="play-btn" onclick="openGame('snake')">SELECT</button>
        </div>
        <div class="game-card">
            <h3>SKY JUMP</h3>
            <p>WATCH OUT FOR MOVING PLATS!</p>
            <button class="play-btn" onclick="openGame('jumper')">SELECT</button>
        </div>
    </div>
</div>

<div id="clicker-game" class="page">
    <div id="click-button">PUSH IT</div>
    <p style="font-size: 7px; margin-top: 20px; text-align: center;">KEEP TAPPING TO<br>STAY IN COMBO!</p>
</div>

<div id="snake-game" class="page">
    <canvas id="snakeCanvas" width="240" height="240"></canvas>
    <div class="snake-ctrl">
        <button class="ctrl-btn" style="grid-column: 2" onclick="snDir='up'">U</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 1" onclick="snDir='left'">L</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 2" onclick="snDir='down'">D</button>
        <button class="ctrl-btn" style="grid-row: 2; grid-column: 3" onclick="snDir='right'">R</button>
    </div>
</div>

<div id="jumper-game" class="page">
    <canvas id="jumperCanvas" width="280" height="380"></canvas>
    <p style="font-size: 7px; margin-top: 15px;">SLIDE YOUR FINGER</p>
</div>

<div id="shop-page" class="page">
    <h2 id="shop-title" style="font-size: 10px; margin: 15px 0;">SHOP</h2>
    <div class="shop-list" id="shop-content"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // СОСТОЯНИЕ
    let coins = parseFloat(localStorage.getItem('d_coins')) || 0;
    let activeMode = 'clicker';
    
    // МЕХАНИКА COMBO
    let combo = 0;
    let comboTimer = null;

    // ПАРАМЕТРЫ
    let clickPwr = 1;
    let clickAuto = 0;
    let snakeMult = 1;
    let snakeSpeed = 120;
    let jumpG = 0.5;
    let jumpBoost = -12;

    const shopData = {
        clicker: [
            { n: "8-BIT CPU", d: "+1 TAP PWR", c: 50, f: () => clickPwr += 1 },
            { n: "BOT.EXE", d: "+5 DC/SEC", c: 400, f: () => clickAuto += 5 },
            { n: "16-BIT CPU", d: "+10 TAP PWR", c: 2000, f: () => clickPwr += 10 }
        ],
        snake: [
            { n: "FAST EAT", d: "X2 POINTS", c: 200, f: () => snakeMult += 1 },
            { n: "OLD RAM", d: "SLOWER SPEED", c: 500, f: () => snakeSpeed += 15 }
        ],
        jumper: [
            { n: "SPRING SHOES", d: "JUMP +2", c: 300, f: () => jumpBoost -= 2 },
            { n: "MOON GRAVITY", d: "GRAVITY -0.1", c: 700, f: () => jumpG -= 0.1 }
        ]
    };

    function showPage(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id + '-page').classList.add('active');
        if(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        if(id === 'shop') renderShop();
        stopGames();
    }

    function openGame(mode) {
        activeMode = mode;
        showPage(mode);
        if(mode === 'snake') initSnake();
        if(mode === 'jumper') initJumper();
    }

    function renderShop() {
        const cont = document.getElementById('shop-content');
        document.getElementById('shop-title').innerText = "SHOP: " + activeMode.toUpperCase();
        cont.innerHTML = '';
        shopData[activeMode].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div style="font-size:8px"><strong>${item.n}</strong><br>${item.d}</div>
                <button class="buy-btn" onclick="buyItem('${activeMode}', ${index})" ${coins < item.c ? 'disabled' : ''}>${item.c}</button>
            `;
            cont.appendChild(div);
        });
    }

    function buyItem(mode, idx) {
        const item = shopData[mode][idx];
        if(coins >= item.c) {
            coins -= item.c;
            item.f();
            item.c = Math.floor(item.c * 1.8);
            updateUI();
            renderShop();
        }
    }

    function updateUI() {
        document.getElementById('total-coins').innerText = Math.floor(coins).toLocaleString();
        localStorage.setItem('d_coins', coins);
    }

    // КЛИКЕР: Механика Combo
    document.getElementById('click-button').onpointerdown = (e) => {
        combo = Math.min(100, combo + 5);
        updateComboUI();

        let multiplier = 1;
        if(combo > 30) multiplier = 2;
        if(combo > 70) multiplier = 5;

        let totalGain = clickPwr * multiplier;
        coins += totalGain;

        const pop = document.createElement('div');
        pop.className = 'pop';
        pop.style.left = e.clientX + 'px'; pop.style.top = e.clientY + 'px';
        pop.innerText = '+' + totalGain;
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 700);
        updateUI();
    };

    function updateComboUI() {
        document.getElementById('combo-fill').style.width = combo + '%';
        let text = "";
        if(combo > 30) text = "COMBO X2!";
        if(combo > 70) text = "ULTRA X5!";
        document.getElementById('combo-text').innerText = text;
    }

    setInterval(() => {
        if(combo > 0) {
            combo -= 1.5;
            if(combo < 0) combo = 0;
            updateComboUI();
        }
    }, 100);

    // ЗМЕЙКА
    const snCanvas = document.getElementById('snakeCanvas');
    const snCtx = snCanvas.getContext('2d');
    let snake, snFood, snDir, snInt;
    function initSnake() {
        snake = [{x:10, y:10}]; snFood = {x:5, y:5}; snDir = 'right';
        clearInterval(snInt);
        snInt = setInterval(drawSnake, snakeSpeed);
    }
    function drawSnake() {
        snCtx.fillStyle = 'var(--retro-green)'; snCtx.fillRect(0,0,240,240);
        snCtx.fillStyle = 'var(--retro-dark)'; 
        snake.forEach(b => snCtx.fillRect(b.x*12, b.y*12, 11, 11));
        snCtx.strokeStyle = 'var(--retro-dark)';
        snCtx.strokeRect(snFood.x*12, snFood.y*12, 11, 11);
        let head = {...snake[0]};
        if(snDir=='up') head.y--; if(snDir=='down') head.y++;
        if(snDir=='left') head.x--; if(snDir=='right') head.x++;
        if(head.x==snFood.x && head.y==snFood.y) {
            coins += 15 * snakeMult; updateUI();
            snFood = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
        } else { snake.pop(); }
        if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x==head.x&&s.y==head.y)) { initSnake(); return; }
        snake.unshift(head);
    }

    // ДЖАМПЕР: Улучшенная логика
    const jmCanvas = document.getElementById('jumperCanvas');
    const jmCtx = jmCanvas.getContext('2d');
    let jActive, jPlayer, jPlats;
    function initJumper() {
        jActive = true; jPlayer = {x:130, y:300, vy:0};
        jPlats = [];
        for(let i=0; i<7; i++) {
            jPlats.push({
                x:Math.random()*210, y:i*60, w:60, 
                type: Math.random() > 0.85 ? 'spring' : 'normal',
                vx: Math.random() > 0.75 ? 1.5 : 0 // Движение платформ
            });
        }
        requestAnimationFrame(drawJumper);
    }
    function drawJumper() {
        if(!jActive || activeMode !== 'jumper') return;
        jmCtx.fillStyle = 'var(--retro-green)'; jmCtx.fillRect(0,0,280,380);
        jPlayer.vy += jumpG; jPlayer.y += jPlayer.vy;
        
        jPlats.forEach(p => {
            // Движущиеся платформы
            if(p.vx !== 0) {
                p.x += p.vx;
                if(p.x <= 0 || p.x >= 220) p.vx *= -1;
            }
            
            jmCtx.fillStyle = 'var(--retro-dark)';
            if(p.type === 'spring') jmCtx.strokeRect(p.x+10, p.y-5, 40, 5); // Пружина визуально
            jmCtx.fillRect(p.x, p.y, p.w, 8);
            
            if(jPlayer.vy > 0 && jPlayer.x+20 > p.x && jPlayer.x < p.x+p.w && jPlayer.y+20 > p.y && jPlayer.y+20 < p.y+12) {
                jPlayer.vy = p.type === 'spring' ? jumpBoost * 2.2 : jumpBoost;
                coins += 2; updateUI();
            }
        });

        if(jPlayer.y < 160) { 
            let d = 160 - jPlayer.y; jPlayer.y = 160; 
            jPlats.forEach(p => { 
                p.y += d; 
                if(p.y > 380) { 
                    p.y = 0; p.x = Math.random()*210; 
                    p.type = Math.random() > 0.85 ? 'spring' : 'normal';
                    p.vx = Math.random() > 0.75 ? 1.5 : 0;
                }
            });
        }
        jmCtx.fillStyle = 'var(--retro-dark)';
        jmCtx.fillRect(jPlayer.x, jPlayer.y, 18, 18);
        if(jPlayer.y > 400) initJumper();
        requestAnimationFrame(drawJumper);
    }
    jmCanvas.addEventListener('touchmove', (e) => {
        let rect = jmCanvas.getBoundingClientRect();
        jPlayer.x = (e.touches[0].clientX - rect.left) - 9;
    });

    function stopGames() { clearInterval(snInt); jActive = false; }
    setInterval(() => { if(clickAuto > 0) { coins += clickAuto / 10; updateUI(); }}, 100);
    updateUI();
</script>
</body>
</html>
