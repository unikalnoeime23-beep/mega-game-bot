<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME HUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .header { margin-top: 40px; text-align: center; }
        /* АНИМАЦИЯ ЗАГОЛОВКА */
        .header h1 { 
            font-size: 36px; margin: 0; 
            background: linear-gradient(90deg, #00d2ff, #ff00cc, #00d2ff); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-weight: 900; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .balance { font-size: 24px; margin: 10px 0; color: #ffcc00; font-weight: bold; }
        .game-list { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        /* АНИМАЦИЯ ПОЯВЛЕНИЯ КАРТОЧЕК */
        .game-card { 
            background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 18px; 
            display: flex; justify-content: space-between; align-items: center;
            opacity: 0; transform: translateY(20px); animation: slideUp 0.6s forwards ease-out;
        }
        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.2s; }
        .game-card:nth-child(3) { animation-delay: 0.3s; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .game-info { display: flex; align-items: center; gap: 15px; }
        .game-titles { display: flex; flex-direction: column; }
        .game-name { font-weight: 800; font-size: 20px; }
        .game-subtitle { font-size: 12px; color: #8b949e; }
        
        /* ПУЛЬСАЦИЯ КНОПОК PLAY */
        .play-button { 
            background: #00a2ff; color: #000; border: none; border-radius: 12px; 
            padding: 12px 24px; font-weight: 900; cursor: pointer; 
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(0, 162, 255, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 162, 255, 0.6); transform: scale(1.05); }
            100% { box-shadow: 0 0 10px rgba(0, 162, 255, 0.2); }
        }

        .market-button { background: #ffaa00; color: #000; border: none; border-radius: 15px; width: 90%; max-width: 400px; padding: 20px; font-weight: 900; margin-top: 30px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(255,170,0,0.3); margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>GAME HUB</h1>
        <div class="balance">💰 <span id="val">...</span></div>
    </div>
    <div class="game-list">
        <div class="game-card">
            <div class="game-info"><span>🐍</span><div class="game-titles"><span class="game-name">SNAKE</span><span class="game-subtitle">Classic Neon</span></div></div>
            <button class="play-button" onclick="location.href='snake.html'">PLAY</button>
        </div>
        <div class="game-card">
            <div class="game-info"><span>🧱</span><div class="game-titles"><span class="game-name">TETRIS</span><span class="game-subtitle">Logic Block</span></div></div>
            <button class="play-button" onclick="location.href='tetris.html'">PLAY</button>
        </div>
        <div class="game-card">
            <div class="game-info"><span>🚀</span><div class="game-titles"><span class="game-name">JUMP</span><span class="game-subtitle">Square Dash</span></div></div>
            <button class="play-button" onclick="location.href='jumper.html'">PLAY</button>
        </div>
    </div>
    <button class="market-button" onclick="closeAndMarket()">Market & Custom</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('val').innerText = params.get('balance') || '0';

        function closeAndMarket() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            }
        }
        
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
