<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Данила Хаб 1990: Эволюция</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; }
        body { font-family: 'Press Start 2P', cursive; background: #1a1a1a; color: var(--dark); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        .console { flex: 1; background: var(--bg); margin: 8px; border: 10px solid #333; border-radius: 15px; display: flex; flex-direction: column; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.4); }
        .header { padding: 8px; border-bottom: 3px solid var(--dark); display: flex; flex-direction: column; background: rgba(0,0,0,0.05); }
        .top-row { display: flex; justify-content: space-between; font-size: 8px; margin-bottom: 5px; }
        
        /* Шкала прогресса цели */
        .goal-bar { width: 100%; height: 6px; border: 1px solid var(--dark); background: transparent; overflow: hidden; }
        #goal-fill { height: 100%; background: var(--dark); width: 0%; transition: width 0.3s; }

        .nav { display: flex; background: #222; }
        .nav button { flex: 1; padding: 12px; border: none; background: #333; color: #666; font-family: 'Press Start 2P'; font-size: 7px; }
        .nav button.active { background: var(--bg); color: var(--dark); }
        
        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }
        .view.active { display: flex; }
        
        canvas { background: var(--bg); border: 3px solid var(--dark); image-rendering: pixelated; display: block; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 10px; }
        .btn { background: var(--dark); color: var(--bg); border: none; width: 60px; height: 50px; font-size: 16px; border-radius: 5px; }
        
        .card { border: 2px solid var(--dark); padding: 10px; margin: 5px; width: 85%; text-align: center; background: rgba(0,0,0,0.03); }
        .buy-btn { background: var(--dark); color: var(--bg); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 8px; width: 100%; margin-top: 5px; cursor: pointer; }
        .buy-btn:disabled { opacity: 0.3; }

        #tap-btn { width: 120px; height: 120px; background: var(--dark); border: 6px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; position: relative; }
        
        /* Секретный артефакт */
        #artifact { position: absolute; width: 30px; height: 30px; background: var(--dark); border: 2px solid var(--bg); display: none; z-index: 100; color: var(--bg); font-size: 8px; align-items: center; justify-content: center; }

        .pop { position: absolute; font-size: 8px; pointer-events: none; animation: popUp 0.6s forwards; color: var(--dark); }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>

<div class="console">
    <div class="header">
        <div class="top-row">
            <span>DC:<span id="dc-val">0</span></span>
            <span>ЦЕЛЬ:<span id="percent">0</span>%</span>
        </div>
        <div class="goal-bar"><div id="goal-fill"></div></div>
    </div>

    <div class="nav">
        <button id="n-menu" class="active" onclick="showTab('menu')">ИГРЫ</button>
        <button id="n-shop" onclick="showTab('shop')">ШОП</button>
        <button onclick="tg.close()">ВЫКЛ</button>
    </div>

    <div id="v-menu" class="view active">
        <div class="card"><span>ПИКСЕЛЬ ТАП</span><button class="buy-btn" onclick="startGame('clicker')">ВЫБРАТЬ</button></div>
        <div class="card"><span>ЗМЕЙКА</span><button class="buy-btn" onclick="startGame('snake')">ВЫБРАТЬ</button></div>
        <div class="card"><span>ПРЫЖОК</span><button class="buy-btn" onclick="startGame('jumper')">ВЫБРАТЬ</button></div>
    </div>

    <div id="v-clicker" class="view">
        <div id="tap-btn" onpointerdown="doTap(event)">ЖМИ!</div>
        <div id="artifact" onpointerdown="catchArtifact(event)">???</div>
    </div>

    <div id="v-snake" class="view">
        <canvas id="snakeCanvas" width="180" height="180"></canvas>
        <div class="controls">
            <button class="btn" style="grid-column: 2" onpointerdown="setDir('up')">↑</button>
            <button class="btn" style="grid-row: 2; grid-column: 1" onpointerdown="setDir('left')">←</button>
            <button class="btn" style="grid-row: 2; grid-column: 2" onpointerdown="setDir('down')">↓</button>
            <button class="btn" style="grid-row: 2; grid-column: 3" onpointerdown="setDir('right')">→</button>
        </div>
    </div>

    <div id="v-jumper" class="view">
        <canvas id="jumperCanvas" width="200" height="250"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 180px;">
            <button class="btn" style="width: 85px;" onpointerdown="jDir=-1" onpointerup="jDir=0">ЛЕВО</button>
            <button class="btn" style="width: 85px;" onpointerdown="jDir=1" onpointerup="jDir=0">ПРАВО</button>
        </div>
    </div>

    <div id="v-shop" class="view" style="justify-content: flex-start; overflow-y: auto; padding-top: 10px;">
        <div id="shop-list" style="width: 100%;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseFloat(localStorage.getItem('dc_v4')) || 0;
    const GOAL = 1000000; // Цель: 1 миллион DC

    let pwr = 1, auto = 0, snS = 130, snM = 1, jJ = -9, jG = 0.35, curGame = 'clicker', jDir = 0, gameLoop;

    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d) {
        try { const o = aCtx.createOscillator(); const g = aCtx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=0.03; o.connect(g); g.connect(aCtx.destination); o.start(); o.stop(aCtx.currentTime+d); } catch(e){}
    }

    const upgrades = {
        clicker: [{n:"СИЛА ТАПА", d:"+1", c:50, f:()=>pwr++}, {n:"АВТО-БОТ", d:"+5/с", c:400, f:()=>auto+=5}],
        snake: [{n:"МНОЖИТЕЛЬ", d:"Яблоки x2", c:150, f:()=>snM++}, {n:"МЕДЛЕННО", d:"-15мс", c:500, f:()=>snS+=15}],
        jumper: [{n:"ПРУЖИНЫ", d:"Прыжок+", c:300, f:()=>jJ-=0.5}, {n:"ГРАВИТАЦИЯ", d:"-0.04", c:700, f:()=>jG-=0.04}]
    };

    function showTab(t) {
        clearInterval(gameLoop);
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + t).classList.add('active');
        document.getElementById('n-' + t)?.classList.add('active');
        if(t === 'shop') renderShop();
        updateUI();
    }

    function startGame(g) { curGame=g; showTab(g); setTimeout(() => { if(g==='snake') initSnake(); if(g==='jumper') initJumper(); }, 100); }

    function updateUI() {
        document.getElementById('dc-val').innerText = Math.floor(coins);
        let progress = Math.min(100, (coins / GOAL) * 100);
        document.getElementById('goal-fill').style.width = progress + '%';
        document.getElementById('percent').innerText = Math.floor(progress);
        localStorage.setItem('dc_v4', coins);
        if(progress >= 100) { document.getElementById('dc-val').style.color = 'white'; }
    }

    function renderShop() {
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        let m = upgrades[curGame] ? curGame : 'clicker';
        upgrades[m].forEach((it, i) => {
            let d = document.createElement('div'); d.className = 'card';
            d.innerHTML = `<div style="font-size:7px">${it.n}</div><button class="buy-btn" id="b-${i}" onclick="buy('${m}',${i})">${it.c} DC</button>`;
            list.appendChild(d);
            if(coins < it.c) document.getElementById('b-'+i).disabled = true;
        });
    }

    function buy(m, i) {
        let it = upgrades[m][i];
        if(coins >= it.c) { beep(600, 0.1); coins -= it.c; it.f(); it.c = Math.floor(it.c*1.8); updateUI(); renderShop(); }
    }

    // КЛИКЕР + АРТЕФАКТЫ
    function doTap(e) {
        beep(400, 0.05); coins += pwr; updateUI();
        if(Math.random() < 0.02) spawnArtifact(); // 2% шанс появления бонуса
        let p = document.createElement('div'); p.className='pop'; p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px'; p.innerText='+'+pwr; document.body.appendChild(p); setTimeout(()=>p.remove(), 600);
    }

    function spawnArtifact() {
        const art = document.getElementById('artifact');
        art.style.display = 'flex';
        art.style.left = Math.random() * 70 + 15 + '%';
        art.style.top = Math.random() * 70 + 15 + '%';
        setTimeout(() => { art.style.display = 'none'; }, 2000);
    }

    function catchArtifact(e) {
        e.stopPropagation();
        beep(900, 0.2);
        let bonus = pwr * 50;
        coins += bonus;
        document.getElementById('artifact').style.display = 'none';
        alert("АРТЕФАКТ НАЙДЕН: +" + bonus + " DC!");
        updateUI();
    }

    // ЗМЕЙКА
    const sC = document.getElementById('snakeCanvas'), sX = sC.getContext('2d');
    let sn, sf, sd;
    function initSnake() { sn = [{x:8, y:8}]; sf = {x:4, y:4}; sd = 'right'; clearInterval(gameLoop); gameLoop = setInterval(drawSnake, snS); }
    function setDir(d) { if(d=='up'&&sd!='down') sd='up'; if(d=='down'&&sd!='up') sd='down'; if(d=='left'&&sd!='right') sd='left'; if(d=='right'&&sd!='left') sd='right'; }
    function drawSnake() {
        sX.fillStyle = '#8bac0f'; sX.fillRect(0,0,180,180); sX.fillStyle = '#0f380f';
        sn.forEach(p => sX.fillRect(p.x*10, p.y*10, 9, 9)); sX.strokeRect(sf.x*10, sf.y*10, 9, 9);
        let h = {...sn[0]}; if(sd=='up') h.y--; if(sd=='down') h.y++; if(sd=='left') h.x--; if(sd=='right') h.x++;
        if(h.x==sf.x && h.y==sf.y) { beep(800, 0.1); coins += 10*snM; updateUI(); sf = {x:Math.floor(Math.random()*18), y:Math.floor(Math.random()*18)}; } else sn.pop();
        if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) { beep(100, 0.2); initSnake(); } else sn.unshift(h);
    }

    // ДЖАМПЕР
    const jC = document.getElementById('jumperCanvas'), jX = jC.getContext('2d');
    let jp, jPlats;
    function initJumper() { 
        jp = {x:90, y:150, vy:0}; jPlats = []; 
        for(let i=0; i<6; i++) jPlats.push({x:Math.random()*150, y:i*45, w:45, vx: Math.random()>0.8?1:0});
        clearInterval(gameLoop); gameLoop = setInterval(drawJumper, 30);
    }
    function drawJumper() {
        jX.fillStyle = '#8bac0f'; jX.fillRect(0,0,200,250);
        jp.vy += jG; jp.y += jp.vy; jp.x += jDir * 4;
        jX.fillStyle = '#0f380f';
        jPlats.forEach(p => {
            p.x += p.vx; if(p.x<0||p.x>155) p.vx*=-1;
            jX.fillRect(p.x, p.y, p.w, 7);
            if(jp.vy > 0 && jp.x+15 > p.x && jp.x < p.x+p.w && jp.y+15 > p.y && jp.y+15 < p.y+10) { beep(500, 0.05); jp.vy = jJ; coins += 2; updateUI(); }
        });
        if(jp.y < 80) { let d = 80 - jp.y; jp.y = 80; jPlats.forEach(p => { p.y += d; if(p.y > 250) { p.y = 0; p.x = Math.random()*150; }}); }
        jX.fillRect(jp.x, jp.y, 15, 15);
        if(jp.y > 260) { beep(100, 0.2); initJumper(); }
        if(jp.x < 0) jp.x = 200; if(jp.x > 200) jp.x = 0;
    }

    setInterval(() => { if(auto > 0) { coins += auto/10; updateUI(); }}, 100);
    updateUI();
</script>
</body>
</html>
