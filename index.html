<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f0f0f; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .game-card { width: 85%; background: #1e1e1e; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; text-align: left; transition: 0.3s; }
        .game-card:active { transform: scale(0.95); background: #252525; }
        .game-card h3 { margin: 0; color: #f39c12; }
        .game-card p { color: #888; font-size: 14px; margin: 5px 0 10px 0; }
        .play-link { display: block; width: 100%; background: #3498db; color: white; text-align: center; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Danila Hub</h1>
    
    <div class="game-card">
        <h3>Snake Retro</h3>
        <p>Классическая змейка. Улучшай скорость и множитель очков!</p>
        <a href="snake.html" class="play-link">ИГРАТЬ</a>
    </div>

    <div class="game-card">
        <h3>Jumper Game</h3>
        <p>Прыгай выше всех. Улучшай высоту прыжка и платформы!</p>
        <a href="jumper.html" class="play-link">ИГРАТЬ</a>
    </div>

    <script>
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
