<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Multi Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #8bac0f; --dark: #0f380f; --mid: #306230; }
        body { 
            font-family: 'Press Start 2P', cursive; background: #222; 
            color: var(--dark); margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; touch-action: manipulation;
        }

        /* Экран консоли */
        .screen {
            flex: 1; background: var(--bg); margin: 10px; border: 10px solid #444;
            border-radius: 10px; display: flex; flex-direction: column; position: relative;
        }

        .header { padding: 10px; border-bottom: 3px solid var(--dark); display: flex; justify-content: space-between; font-size: 10px; }

        .nav { display: flex; background: #333; }
        .nav button { flex: 1; padding: 12px; border: none; background: #444; color: #888; font-family: 'Press Start 2P'; font-size: 8px; }
        .nav button.active { background: var(--bg); color: var(--dark); }

        .view { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .view.active { display: flex; }

        /* Игровые элементы */
        .card { border: 3px solid var(--dark); padding: 15px; margin: 10px; width: 80%; text-align: center; }
        .btn-big { background: var(--dark); color: var(--bg); border: none; padding: 10px; width: 100%; font-family: 'Press Start 2P'; font-size: 10px; margin-top: 10px; }
        
        #tap-button { width: 120px; height: 120px; background: var(--dark); border: 5px double var(--bg); color: var(--bg); display: flex; align-items: center; justify-content: center; }

        canvas { background: var(--bg); border: 3px solid var(--dark); display: block; }

        /* Кнопки управления (только для мобил, на ПК будут стрелки) */
        .controls { display: grid; grid-template-columns: repeat(3, 50px); gap: 10px; margin-top: 10px; }
        .ctrl { background: var(--dark); color: var(--bg); border: none; width: 50px; height: 50px; font-size: 18px; border-radius: 5px; }

        .shop-row { width: 90%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--dark); padding: 5px 0; font-size: 8px; }
    </style>
</head>
<body>

<div class="screen">
    <div class="header">
        <span>DC: <span id="coins-display">0</span></span>
        <span id="mode-title">MENU</span>
    </div>

    <div class="nav">
        <button id="n-menu" class="active" onclick="switchTab('menu')">GAMES</button>
        <button id="n-shop" onclick="switchTab('shop')">SHOP</button>
        <button onclick="tg.close()">OFF</button>
    </div>

    <div id="v-menu" class="view active">
        <div class="card">
            <div style="font-size: 10px;">TAP MASTER</div>
            <button class="btn-big" onclick="startApp('clicker')">SELECT</button>
        </div>
        <div class="card">
            <div style="font-size: 10px;">SNAKE</div>
            <button class="btn-big" onclick="startApp('snake')">SELECT</button>
        </div>
        <div class="card">
            <div style="font-size: 10px;">JUMPER</div>
            <button class="btn-big" onclick="startApp('jumper')">SELECT</button>
        </div>
    </div>

    <div id="v-clicker" class="view">
        <div id="tap-button" onpointerdown="clickMe(event)">TAP</div>
        <p id="combo-tag" style="font-size: 8px; margin-top: 10px;">X1</p>
    </div>

    <div id="v-snake" class="view">
        <canvas id="sCanvas" width="180" height="180"></canvas>
        <div class="controls">
            <button class="ctrl" style="grid-column: 2" onclick="changeSnakeDir('up')">↑</button>
            <button class="ctrl" style="grid-row: 2; grid-column: 1" onclick="changeSnakeDir('left')">←</button>
            <button class="ctrl" style="grid-row: 2; grid-column: 2" onclick="changeSnakeDir('down')">↓</button>
            <button class="ctrl" style="grid-row: 2; grid-column: 3" onclick="changeSnakeDir('right')">→</button>
        </div>
    </div>

    <div id="v-jumper" class="view">
        <canvas id="jCanvas" width="200" height="260"></canvas>
        <div class="controls" style="grid-template-columns: 1fr 1fr; width: 180px;">
            <button class="ctrl" style="width: 80px;" onmousedown="moveJ(-1)" onmouseup="moveJ(0)" ontouchstart="moveJ(-1)" ontouchend="moveJ(0)">LEFT</button>
            <button class="ctrl" style="width: 80px;" onmousedown="moveJ(1)" onmouseup="moveJ(0)" ontouchstart="moveJ(1)" ontouchend="moveJ(0)">RIGHT</button>
        </div>
    </div>

    <div id="v-shop" class="view" style="justify-content: flex-start; padding-top: 10px; overflow-y: auto;">
        <div id="shop-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = parseFloat(localStorage.getItem('dc')) || 0;
    let clickP = 1, autoDC = 0, snM = 1, snS = 130, jJ = -11, jG = 0.5;
    let cur = 'menu', gameInt;

    const shopItems = {
        clicker: [{n:"POWER+", c:50, f:()=>clickP++}, {n:"AUTO+", c:500, f:()=>autoDC+=2}],
        snake: [{n:"APPLE X2", c:200, f:()=>snM++}],
        jumper: [{n:"JUMP+", c:300, f:()=>jJ--}]
    };

    function switchTab(id) {
        stopAll();
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + id).classList.add('active');
        document.getElementById('n-' + id)?.classList.add('active');
        cur = id;
        document.getElementById('mode-title').innerText = id.toUpperCase();
        if(id === 'shop') renderShop();
    }

    function startApp(game) {
        switchTab(game);
        if(game === 'snake') initSnake();
        if(game === 'jumper') initJumper();
    }

    function renderShop() {
        const list = document.getElementById('shop-list');
        list.innerHTML = '';
        let m = (shopItems[cur]) ? cur : 'clicker';
        shopItems[m].forEach((it, i) => {
            const row = document.createElement('div');
            row.className = 'shop-row';
            row.innerHTML = `<span>${it.n} (C:${it.c})</span><button onclick="buy('${m}',${i})" style="background:var(--dark);color:var(--bg);font-size:8px;padding:5px;">BUY</button>`;
            list.appendChild(row);
        });
    }

    function buy(m, i) {
        let it = shopItems[m][i];
        if(coins >= it.c) { coins -= it.c; it.f(); it.c = Math.floor(it.c*1.7); updateUI(); renderShop(); }
    }

    function updateUI() {
        document.getElementById('coins-display').innerText = Math.floor(coins);
        localStorage.setItem('dc', coins);
    }

    // --- КЛИКЕР ---
    function clickMe(e) {
        coins += clickP; updateUI();
        let p = document.createElement('div'); p.style.position='absolute'; p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px'; p.innerText='+'+clickP; p.style.fontSize='10px'; p.style.pointerEvents='none'; document.body.appendChild(p);
        setTimeout(()=>p.remove(), 400);
    }

    // --- ЗМЕЙКА ---
    const sC = document.getElementById('sCanvas'), sX = sC.getContext('2d');
    let sn, sf, sd;
    function initSnake() {
        sn = [{x:8, y:8}]; sf = {x:4, y:4}; sd = 'right';
        clearInterval(gameInt); gameInt = setInterval(loopSnake, snS);
    }
    function changeSnakeDir(dir) {
        if(dir=='up'&&sd!='down') sd='up'; if(dir=='down'&&sd!='up') sd='down';
        if(dir=='left'&&sd!='right') sd='left'; if(dir=='right'&&sd!='left') sd='right';
    }
    function loopSnake() {
        sX.fillStyle = 'var(--bg)'; sX.fillRect(0,0,180,180);
        sX.fillStyle = 'var(--dark)'; sn.forEach(b => sX.fillRect(b.x*10, b.y*10, 9, 9));
        sX.strokeRect(sf.x*10, sf.y*10, 9, 9);
        let h = {...sn[0]};
        if(sd=='up') h.y--; if(sd=='down') h.y++; if(sd=='left') h.x--; if(sd=='right') h.x++;
        if(h.x==sf.x && h.y==sf.y) {
            coins += 10*snM; updateUI(); sf = {x:Math.floor(Math.random()*18), y:Math.floor(Math.random()*18)};
        } else sn.pop();
        if(h.x<0||h.x>=18||h.y<0||h.y>=18||sn.some(s=>s.x==h.x&&s.y==h.y)) initSnake();
        else sn.unshift(h);
    }

    // --- ДЖАМПЕР ---
    const jC = document.getElementById('jCanvas'), jX = jC.getContext('2d');
    let jP, jL, jI = 0, jActive = false;
    function initJumper() {
        jActive = true; jP = {x:90, y:150, vy:0}; jL = [];
        for(let i=0; i<5; i++) jL.push({x:Math.random()*150, y:i*50, w:40});
        requestAnimationFrame(loopJumper);
    }
    function moveJ(v) { jI = v; }
    function loopJumper() {
        if(!jActive || cur !== 'jumper') return;
        jX.fillStyle = 'var(--bg)'; jX.fillRect(0,0,200,260);
        jP.vy += jG; jP.y += jP.vy; jP.x += jI * 4;
        jX.fillStyle = 'var(--dark)';
        jL.forEach(p => {
            jX.fillRect(p.x, p.y, p.w, 8);
            if(jP.vy > 0 && jP.x+15 > p.x && jP.x < p.x+p.w && jP.y+15 > p.y && jP.y+15 < p.y+10) { jP.vy = jJ; coins += 2; updateUI(); }
        });
        if(jP.y < 80) { let d = 80 - jP.y; jP.y = 80; jL.forEach(p => { p.y += d; if(p.y > 260) { p.y = 0; p.x = Math.random()*150; }}); }
        jX.fillRect(jP.x, jP.y, 15, 15);
        if(jP.y > 280) initJumper();
        if(jP.x < 0) jP.x = 200; if(jP.x > 200) jP.x = 0;
        requestAnimationFrame(loopJumper);
    }

    // УПРАВЛЕНИЕ КЛАВИАТУРОЙ (ДЛЯ ПК)
    window.addEventListener('keydown', (e) => {
        if(cur === 'snake') {
            if(e.key === 'ArrowUp') changeSnakeDir('up');
            if(e.key === 'ArrowDown') changeSnakeDir('down');
            if(e.key === 'ArrowLeft') changeSnakeDir('left');
            if(e.key === 'ArrowRight') changeSnakeDir('right');
        }
        if(cur === 'jumper') {
            if(e.key === 'ArrowLeft') jI = -1;
            if(e.key === 'ArrowRight') jI = 1;
        }
    });
    window.addEventListener('keyup', (e) => {
        if(cur === 'jumper') jI = 0;
    });

    function stopAll() { clearInterval(gameInt); jActive = false; }
    setInterval(() => { if(autoDC > 0) { coins += autoDC/10; updateUI(); }}, 100);
    updateUI();
</script>
</body>
</html>
