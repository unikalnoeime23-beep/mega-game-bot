<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME HUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Arial', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { margin-top: 40px; margin-bottom: 20px; text-align: center; }
        
        /* АНИМАЦИЯ ЗАГОЛОВКА */
        .header h1 { 
            font-size: 32px; 
            margin: 0; 
            background: linear-gradient(90deg, #00d2ff, #ff00cc, #00d2ff); 
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 900; 
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .balance { font-size: 24px; margin: 10px 0; font-weight: bold; color: #ffcc00; }
        .game-list { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        
        /* АНИМАЦИЯ ПОЯВЛЕНИЯ КАРТОЧЕК */
        .game-card { 
            background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .game-info { display: flex; align-items: center; gap: 12px; }
        .game-icon { font-size: 24px; }
        .game-titles { display: flex; flex-direction: column; }
        .game-name { font-weight: bold; font-size: 18px; }
        .game-subtitle { font-size: 12px; color: #8b949e; }
        
        /* АНИМАЦИЯ КНОПОК PLAY */
        .play-button { 
            background: #00a2ff; color: black; border: none; border-radius: 15px; 
            padding: 10px 25px; font-weight: bold; font-size: 14px; cursor: pointer; 
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(0, 162, 255, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 162, 255, 0.6); transform: scale(1.05); }
            100% { box-shadow: 0 0 10px rgba(0, 162, 255, 0.2); }
        }

        .market-button { background: #ffaa00; color: black; border: none; border-radius: 15px; width: 90%; max-width: 400px; padding: 18px; font-weight: bold; font-size: 16px; margin-top: 20px; text-transform: uppercase; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255, 170, 0, 0.3); cursor: pointer;}
    </style>
</head>
<body>

    <div class="header">
        <h1>GAME HUB</h1>
        <div class="balance">💰 <span id="balance-value">Загрузка...</span></div>
    </div>

    <div class="game-list">
        <div class="game-card">
            <div class="game-info"><span>🐍</span><div class="game-titles"><span class="game-name">SNAKE</span><span class="game-subtitle">Neon Arcade</span></div></div>
            <button class="play-button" onclick="goToGame('snake.html')">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info"><span>🧱</span><div class="game-titles"><span class="game-name">TETRIS</span><span class="game-subtitle">Classic Block</span></div></div>
            <button class="play-button" onclick="goToGame('tetris.html')">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info"><span>🚀</span><div class="game-titles"><span class="game-name">JUMP</span><span class="game-subtitle">Gravity Test</span></div></div>
            <button class="play-button" onclick="goToGame('jumper.html')">PLAY</button>
        </div>
    </div>

    <button class="market-button" onclick="openMarket()">Market & Custom</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('balance') || '0';
        document.getElementById('balance-value').innerText = userBalance;

        function goToGame(fileName) {
            const fullUrl = `https://unikalnoeime23-beep.github.io/mega-game-bot/${fileName}?balance=${userBalance}`;
            window.location.href = fullUrl;
        }

        // ЛОГИКА ДЛЯ МАРКЕТА
        function openMarket() {
            if (window.Telegram && window.Telegram.WebApp) {
                // Показываем нативное окно телеграма и закрываем Web App
                window.Telegram.WebApp.showAlert("Маркет находится в чате с ботом! 🛒\nСейчас я закрою меню.", function() {
                    window.Telegram.WebApp.close();
                });
            } else {
                alert("Маркет работает только внутри Telegram!");
            }
        }

        // Разворачиваем Web App на всю высоту, чтобы выглядело круто
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
