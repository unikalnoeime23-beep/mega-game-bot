<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0a0a0a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Шапка с балансом */
        .stats { position: absolute; top: 30px; text-align: center; width: 100%; }
        .balance { font-size: 42px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .prestige-rank { font-size: 18px; color: #aaa; margin-top: 5px; }

        /* Круглая кнопка */
        #click-button {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ff4d4d 0%, #990000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.05s;
            border: 10px solid #222;
        }
        #click-button:active { transform: scale(0.92); }

        /* Всплывающие цифры */
        .floating-text {
            position: absolute;
            color: #f1c40f;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            animation: moveUp 1s linear forwards;
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-150px); opacity: 0; }
        }

        /* Магазин */
        .shop { position: absolute; bottom: 40px; width: 90%; max-width: 400px; }
        .upgrade-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        button {
            background: #27ae60;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }
        button:disabled { background: #444; color: #777; }

        /* Кнопка престижа */
        #prestige-btn {
            margin-top: 15px;
            background: #8e44ad;
            display: none; /* Появится при 1 млрд */
        }
    </style>
</head>
<body>

    <div class="stats">
        <div class="balance"><span id="balance">0</span> DC</div>
        <div class="prestige-rank">Престиж: <span id="emblem">🆕</span> (x<span id="mult">1.0</span>)</div>
    </div>

    <div id="click-button">CLICK</div>

    <div class="shop">
        <div class="upgrade-card">
            <div>
                <strong>AFK БОТ (Ур. <span id="afk-lvl">0</span>)</strong><br>
                <small id="afk-cost">Нужно 500 DC</small>
            </div>
            <button id="buy-afk-btn" onclick="buyAfk()">КУПИТЬ</button>
        </div>
        
        <button id="prestige-btn" style="width: 100%" onclick="doPrestige()">СБРОСИТЬ (ПРЕСТИЖ +1)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Данные игры
        let balance = parseFloat(localStorage.getItem('dc_bal')) || 0;
        let prestige = parseInt(localStorage.getItem('dc_pre')) || 0;
        let afkLevel = parseInt(localStorage.getItem('dc_afk')) || 0;

        const emblems = ["🆕", "🥉", "🥈", "🥇", "💎", "🔥", "👑", "🌌", "🚀", "🔱", "⚛️"];
        const AFK_BASE_COST = 500;
        const PRESTIGE_GOAL = 1000000000; // 1 миллиард

        const btn = document.getElementById('click-button');

        // Клик
        btn.addEventListener('pointerdown', (e) => {
            let power = (1 + prestige * 0.2); // x1.2 за каждый престиж
            balance += power;
            showPopUp(e.clientX, e.clientY, power);
            updateUI();
        });

        function showPopUp(x, y, val) {
            const pop = document.createElement('div');
            pop.className = 'floating-text';
            pop.style.left = x + 'px';
            pop.style.top = y + 'px';
            pop.innerText = '+' + val.toFixed(1);
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance).toLocaleString();
            document.getElementById('afk-lvl').innerText = afkLevel;
            document.getElementById('emblem').innerText = emblems[prestige] || "⚛️";
            document.getElementById('mult').innerText = (1 + prestige * 0.2).toFixed(1);

            // Логика покупки AFK
            let nextAfkCost = AFK_BASE_COST * (afkLevel + 1);
            let afkBtn = document.getElementById('buy-afk-btn');
            document.getElementById('afk-cost').innerText = `Цена: ${nextAfkCost} DC`;
            afkBtn.disabled = balance < nextAfkCost;

            // Кнопка престижа
            let pBtn = document.getElementById('prestige-btn');
            if (balance >= PRESTIGE_GOAL && prestige < 10) {
                pBtn.style.display = "block";
            } else {
                pBtn.style.display = "none";
            }

            // Сохранение
            localStorage.setItem('dc_bal', balance);
            localStorage.setItem('dc_pre', prestige);
            localStorage.setItem('dc_afk', afkLevel);
        }

        function buyAfk() {
            let nextAfkCost = AFK_BASE_COST * (afkLevel + 1);
            if (balance >= nextAfkCost) {
                balance -= nextAfkCost;
                afkLevel++;
                updateUI();
            }
        }

        function doPrestige() {
            if (confirm("Сбросить всё ради усиления x1.2?")) {
                prestige++;
                balance = 0;
                afkLevel = 0;
                updateUI();
            }
        }

        // AFK Цикл (каждую секунду)
        setInterval(() => {
            if (afkLevel > 0) {
                let income = (afkLevel * 2) * (1 + prestige * 0.2);
                balance += income;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
