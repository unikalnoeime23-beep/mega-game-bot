<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danila Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Навигация */
        .nav-bar {
            display: flex;
            background: #1a1a1a;
            justify-content: space-around;
            padding: 10px 0;
            border-bottom: 2px solid #333;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn.active { color: #f39c12; border-bottom: 2px solid #f39c12; }
        .exit-btn { color: #e74c3c; }

        /* Контент */
        .page { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; position: relative; }
        .page.active { display: flex; }

        /* Кликер (Твой стиль) */
        .header { position: absolute; top: 20px; text-align: center; }
        .balance-text { font-size: 32px; font-weight: bold; color: #f39c12; margin-bottom: 5px; }
        #click-button {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #e74c3c 0%, #c0392b 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; border: 8px solid #962d22;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.4); transition: transform 0.05s;
        }
        #click-button:active { transform: scale(0.95); }

        /* Список игр */
        .game-list { width: 80%; }
        .game-card {
            background: #1e1e1e; padding: 20px; border-radius: 15px; margin-bottom: 15px;
            text-align: center; border: 1px solid #333; cursor: pointer;
        }
        .game-card:hover { border-color: #f39c12; }

        /* Всплывашки */
        .pop-up { position: absolute; color: #f1c40f; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-120px); opacity: 0; } }

        button.buy-btn { background: #27ae60; border: none; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        button:disabled { background: #555; color: #888; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="showPage('list-page', this)">🎮 ИГРЫ</button>
        <button class="nav-btn" onclick="showPage('clicker-page', this)">💰 КЛИКЕР</button>
        <button class="nav-btn exit-btn" onclick="tg.close()">ВЫХОД</button>
    </div>

    <div id="list-page" class="page active">
        <h2>Выбери игру, Данил</h2>
        <div class="game-list">
            <div class="game-card" onclick="showPage('clicker-page')">
                <h3>Danila Coin Clicker</h3>
                <p>Жми и богатей!</p>
            </div>
            <div class="game-card" onclick="alert('Запуск Square Jumper...')">
                <h3>Square Jumper</h3>
                <p>Тот самый квадратный прыгун</p>
            </div>
        </div>
    </div>

    <div id="clicker-page" class="page">
        <div class="header">
            <div class="balance-text"><span id="balance">0</span> DC</div>
            <div class="prestige-info" style="color:#bdc3c7">Престиж: <span id="emblem">🆕</span> (x<span id="mult">1.0</span>)</div>
        </div>

        <div id="click-button">CLICK</div>

        <div style="margin-top: 30px; width: 80%;">
            <div style="background: #1e1e1e; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;">
                <div>
                    <strong>AFK-Бот</strong><br>
                    <small id="afk-desc" style="color:#888">Нужно 500 DC</small>
                </div>
                <button class="buy-btn" id="buy-afk" onclick="buyAfk()" disabled>Купить</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let prestige = 0;
        let afkLevel = 0;
        let clickPower = 1;
        const emblems = ["🆕", "🥉", "🥈", "🥇", "💎", "🔥", "👑", "🌌", "🚀", "🔱", "⚛️"];

        // Навигация
        function showPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        // Логика кликера (Твой код)
        const clickBtn = document.getElementById('click-button');
        clickBtn.addEventListener('pointerdown', (e) => {
            let multiplier = Math.pow(1.2, prestige);
            let currentGain = clickPower * multiplier;
            balance += currentGain;
            showPopUp(e.clientX, e.clientY, currentGain);
            updateUI();
            checkPrestige();
        });

        function showPopUp(x, y, val) {
            const pop = document.createElement('div');
            pop.className = 'pop-up';
            pop.style.left = (x - 20) + 'px';
            pop.style.top = (y - 20) + 'px';
            pop.innerText = '+' + val.toFixed(1);
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance).toLocaleString();
            document.getElementById('emblem').innerText = emblems[prestige] || "⚛️";
            document.getElementById('mult').innerText = Math.pow(1.2, prestige).toFixed(1);
            
            const afkBtn = document.getElementById('buy-afk');
            if (balance >= 500) {
                afkBtn.disabled = false;
                document.getElementById('afk-desc').innerText = "Доступно! Цена: 500";
                document.getElementById('afk-desc').style.color = "#27ae60";
            } else {
                afkBtn.disabled = true;
                document.getElementById('afk-desc').innerText = `Нужно 500 DC`;
                document.getElementById('afk-desc').style.color = "#888";
            }
        }

        function buyAfk() {
            if (balance >= 500) {
                balance -= 500;
                afkLevel++;
                updateUI();
            }
        }

        function checkPrestige() {
            if (balance >= 1000000000 && prestige < 10) {
                prestige++;
                balance = 0;
                afkLevel = 0;
                alert("УРОВЕНЬ ПРЕСТИЖА ПОВЫШЕН!");
                updateUI();
            }
        }

        setInterval(() => {
            if (afkLevel > 0) {
                let multiplier = Math.pow(1.2, prestige);
                balance += (afkLevel * 5) * multiplier;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
