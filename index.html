<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME HUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .header { margin-top: 40px; text-align: center; animation: fadeIn 1s ease; }
        .header h1 { font-size: 36px; margin: 0; background: linear-gradient(90deg, #00d2ff, #ff00cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .balance { font-size: 24px; margin: 10px 0; color: #ffcc00; font-weight: bold; }
        .game-list { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Анимация карточек */
        .game-card { 
            background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 18px; 
            display: flex; justify-content: space-between; align-items: center;
            opacity: 0; transform: translateY(20px); animation: slideUp 0.6s forwards;
        }
        .game-card:nth-child(1) { animation-delay: 0.2s; }
        .game-card:nth-child(2) { animation-delay: 0.4s; }
        .game-card:nth-child(3) { animation-delay: 0.6s; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .game-info { display: flex; align-items: center; gap: 15px; }
        .game-titles { display: flex; flex-direction: column; }
        .game-name { font-weight: 800; font-size: 20px; }
        .game-subtitle { font-size: 12px; color: #8b949e; }
        .play-button { background: #00a2ff; color: #000; border: none; border-radius: 12px; padding: 12px 24px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .play-button:active { transform: scale(0.9); }
        .market-button { background: #ffaa00; color: #000; border: none; border-radius: 15px; width: 90%; padding: 20px; font-weight: 900; margin-top: 30px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(255,170,0,0.3); }
    </style>
</head>
<body>
    <div class="header">
        <h1>GAME HUB</h1>
        <div class="balance">💰 <span id="val">...</span></div>
    </div>
    <div class="game-list">
        <div class="game-card">
            <div class="game-info"><span>🐍</span><div class="game-titles"><span class="game-name">SNAKE</span><span class="game-subtitle">Classic Neon</span></div></div>
            <button class="play-button" onclick="location.href='snake.html'">PLAY</button>
        </div>
        <div class="game-card">
            <div class="game-info"><span>🧱</span><div class="game-titles"><span class="game-name">TETRIS</span><span class="game-subtitle">Logic Block</span></div></div>
            <button class="play-button" onclick="location.href='tetris.html'">PLAY</button>
        </div>
        <div class="game-card">
            <div class="game-info"><span>🚀</span><div class="game-titles"><span class="game-name">JUMP</span><span class="game-subtitle">Square Dash</span></div></div>
            <button class="play-button" onclick="location.href='jumper.html'">PLAY</button>
        </div>
    </div>
    <button class="market-button" onclick="closeAndMarket()">Market & Custom</button>

    <script>
        // Получаем баланс из URL
        const params = new URLSearchParams(window.location.search);
        document.getElementById('val').innerText = params.get('balance') || '0';

        function closeAndMarket() {
            // Закрываем Web App, чтобы юзер увидел кнопки в боте
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            }
        }
        
        // Разворачиваем на весь экран
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
