<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME HUB</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .header {
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 34px;
            margin: 0;
            background: linear-gradient(90deg, #00d2ff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .balance {
            font-size: 26px;
            margin-top: 10px;
            font-weight: bold;
            color: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .game-list {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon {
            font-size: 22px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .game-titles {
            display: flex;
            flex-direction: column;
        }

        .game-name {
            font-weight: bold;
            font-size: 19px;
            letter-spacing: 0.5px;
        }

        .game-subtitle {
            font-size: 13px;
            color: #8b949e;
        }

        .play-button {
            background: #00d2ff;
            color: black;
            border: none;
            border-radius: 18px;
            padding: 12px 30px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }

        .play-button:active {
            transform: scale(0.95);
            background: #00b8e6;
        }

        .market-button {
            background: #ffaa00;
            color: black;
            border: none;
            border-radius: 18px;
            width: 100%;
            padding: 20px;
            font-weight: 900;
            font-size: 16px;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GAME HUB</h1>
        <div class="balance">💰 95</div>
    </div>

    <div class="game-list">
        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🐍</span>
                <div class="game-titles">
                    <span class="game-name">SNAKE</span>
                    <span class="game-subtitle">Neon Arcade</span>
                </div>
            </div>
            <button class="play-button" onclick="location.href='index_game.html'">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🚀</span>
                <div class="game-titles">
                    <span class="game-name">JUMP</span>
                    <span class="game-subtitle">Gravity Test</span>
                </div>
            </div>
            <button class="play-button" onclick="location.href='jumper.html'">PLAY</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <span class="game-icon">🧱</span>
                <div class="game-titles">
                    <span class="game-name">TETRIS</span>
                    <span class="game-subtitle">Classic Block</span>
                </div>
            </div>
            <button class="play-button" onclick="location.href='tetris.html'">PLAY</button>
        </div>

        <button class="market-button" onclick="alert('Market coming soon!')">Market & Custom</button>
    </div>

</body>
</html>
